# Linux Break-The-Glass (BTG) Account Check (Go plugin)
# Key: btg.account.check.log[<logfile>,"<account1,account2,...>"]
#
# Tails an auth log incrementally (checkpointed) and reports when one of the
# monitored emergency/break-glass accounts authenticates. Returns either:
#   "OK: no BTG accounts detected"
#   "btg account '<name>' seen in <logfile>: <line>"   (one line per detection)
#   "ERROR: <reason>"
#
# Run manually for testing:
#   ./zabbix-agent2-linux-btg-account-check --standalone /var/log/secure breakglass,emergencyadmin
#
# Test through Agent 2:
#   zabbix_agent2 -c /etc/zabbix/zabbix_agent2.conf -t 'btg.account.check.log[/var/log/secure,"breakglass"]'
#
# Optional environment overrides (set in the agent service environment):
#   CHECKPOINT_DIR        directory for per-file read offsets (default /var/lib/zabbix-agent2/BTGAccountCheck)
#   ALERT_DEDUP_SECONDS   suppress duplicate detections of the same account within this window (default 300)
#
# Notes:
#   - Use /var/log/secure on RHEL/SUSE and /var/log/auth.log on Debian/Ubuntu.
#   - The agent must be able to read the auth log and write the checkpoint dir.
#   - Detections are incremental: a given login is reported once. Use a trigger
#     with a time window (see the template) so the problem stays visible.
Plugins.BTGAccountCheck.System.Path=/usr/sbin/zabbix-agent2-plugin/zabbix-agent2-linux-btg-account-check
