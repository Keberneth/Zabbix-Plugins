# Linux Time Synchronization (Go plugin)
# Key: linux.ntp.sync[server]
#
# Returns JSON: success, ntp_server, local_ts, ntp_ts, diff_seconds (clock offset,
# positive = local clock behind), stratum, rtt_ms, attempts, error.
#
# Run manually for testing:
#   ./zabbix-agent2-linux-ntp-sync --standalone
#   ./zabbix-agent2-linux-ntp-sync --standalone time.cloudflare.com
#
# Test through Agent 2:
#   zabbix_agent2 -c /etc/zabbix/zabbix_agent2.conf -t "linux.ntp.sync[pool.ntp.org]"
#
# Notes:
#   - Set the template macro {$NTP.SERVER} to the reference server. In an Active
#     Directory domain set this to the PDC Emulator so Linux hosts are checked
#     against the same authority as Windows.
#   - The plugin makes up to 3 validated attempts (3s timeout each) and rejects
#     Kiss-of-Death and unsynchronised/stratum-0/16 responses.
#   - Install the binary at the path below and secure it:
#       chown root:zabbix /usr/sbin/zabbix-agent2-plugin/zabbix-agent2-linux-ntp-sync
#       chmod 750        /usr/sbin/zabbix-agent2-plugin/zabbix-agent2-linux-ntp-sync
Plugins.LinuxNTPSync.System.Path=/usr/sbin/zabbix-agent2-plugin/zabbix-agent2-linux-ntp-sync
