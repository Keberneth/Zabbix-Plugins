zabbix_export:
  version: '7.0'
  template_groups:
    - uuid: 7df96b18c230490a9a0a9e2307226338
      name: Templates
  templates:
    - uuid: 81aa0288feba426b989747e920bdd541
      template: 'Linux Time Synchronization by Zabbix agent 2 active'
      name: 'Linux Time Synchronization by Zabbix agent 2 active'
      description: |
        Verifies that the local clock is correct by measuring the offset against a reference NTP
        server, via the Go plugin "LinuxNTPSync" (item key linux.ntp.sync[server]).

        The plugin returns JSON: success, ntp_server, local_ts, ntp_ts, diff_seconds (clock offset,
        positive = local clock behind), stratum, rtt_ms, attempts, error. It performs up to 3
        validated attempts (Kiss-of-Death and unsynchronised/stratum-0/16 responses are rejected).

        Time drift: the "offset" item keeps trends for a year, so its graph IS the long-term drift of
        this host's clock against the reference. Warning/critical thresholds are macros with sensible
        defaults so problems are caught early.

        Set {$NTP.SERVER} to the reference server. In an Active Directory domain set this to the PDC
        Emulator so Linux hosts are checked against the same authority as Windows.

        Install:
          1. Copy the binary to /usr/sbin/zabbix-agent2-plugin/zabbix-agent2-linux-ntp-sync
          2. Add to the agent config (e.g. /etc/zabbix/zabbix_agent2.d/):
             Plugins.LinuxNTPSync.System.Path=/usr/sbin/zabbix-agent2-plugin/zabbix-agent2-linux-ntp-sync
          3. Restart zabbix-agent2.
      groups:
        - name: Templates
      items:
        - uuid: ffb22ecfdc6b496e921e0c6342ecd980
          name: 'Linux time synchronization status (raw)'
          type: ZABBIX_ACTIVE
          key: 'linux.ntp.sync[{$NTP.SERVER}]'
          delay: '{$NTP.CHECK.INTERVAL}'
          history: 1d
          value_type: TEXT
          trends: '0'
          timeout: 10s
          description: 'Master item: raw JSON from the NTP plugin for {$NTP.SERVER}.'
          triggers:
            - uuid: 2e5fac3b8d4e49e1c7b2d3e4f5a6b7c8
              expression: 'nodata(/Linux Time Synchronization by Zabbix agent 2 active/linux.ntp.sync[{$NTP.SERVER}],{$NTP.NODATA})=1'
              name: 'Linux time synchronization is not being collected'
              priority: WARNING
              description: 'No NTP measurement has been received within {$NTP.NODATA}. Time monitoring is blind on this host (agent down, plugin missing, or item misconfigured).'
        - uuid: 99ee4d17632f4be3a62110cd0bb7ce41
          name: 'Linux time offset'
          type: DEPENDENT
          key: linux.ntp.sync.server.diff.seconds
          delay: '0'
          history: 7d
          trends: 365d
          value_type: FLOAT
          units: s
          description: 'Clock offset against {$NTP.SERVER} (positive = local clock is behind). Its yearly trend shows long-term drift.'
          preprocessing:
            - type: JSONPATH
              parameters:
                - $.diff_seconds
              error_handler: DISCARD_VALUE
          master_item:
            key: 'linux.ntp.sync[{$NTP.SERVER}]'
          triggers:
            - uuid: 374053a17cfc41069183513043f9fae1
              expression: 'abs(last(/Linux Time Synchronization by Zabbix agent 2 active/linux.ntp.sync.server.diff.seconds))>{$NTP.OFFSET.WARN}'
              name: 'Linux clock offset exceeds warning threshold (>{$NTP.OFFSET.WARN}s)'
              priority: WARNING
              description: 'The local clock differs from {$NTP.SERVER} by more than {$NTP.OFFSET.WARN} seconds.'
              dependencies:
                - name: 'Linux clock offset exceeds critical threshold (>{$NTP.OFFSET.CRIT}s)'
                  expression: 'abs(last(/Linux Time Synchronization by Zabbix agent 2 active/linux.ntp.sync.server.diff.seconds))>{$NTP.OFFSET.CRIT}'
            - uuid: 43de573c8f4f466da8e1021c201ac1f0
              expression: 'abs(last(/Linux Time Synchronization by Zabbix agent 2 active/linux.ntp.sync.server.diff.seconds))>{$NTP.OFFSET.CRIT}'
              name: 'Linux clock offset exceeds critical threshold (>{$NTP.OFFSET.CRIT}s)'
              priority: HIGH
              description: 'The local clock differs from {$NTP.SERVER} by more than {$NTP.OFFSET.CRIT} seconds. Large offsets break Kerberos/AD authentication once they reach 5 minutes.'
        - uuid: 588f7a97081c4f82af122b56465623cd
          name: 'Linux time synchronization succeeded'
          type: DEPENDENT
          key: linux.ntp.sync.success
          delay: '0'
          history: 7d
          value_type: UNSIGNED
          description: '1 if the last NTP query succeeded and was validated, 0 otherwise.'
          valuemap:
            name: 'NTP success'
          preprocessing:
            - type: JSONPATH
              parameters:
                - $.success
            - type: JAVASCRIPT
              parameters:
                - 'return (String(value).toLowerCase() === ''true'' || value == 1) ? 1 : 0;'
          master_item:
            key: 'linux.ntp.sync[{$NTP.SERVER}]'
          triggers:
            - uuid: 203773b610b3404bbd3968c07938f78b
              expression: 'last(/Linux Time Synchronization by Zabbix agent 2 active/linux.ntp.sync.success)=0'
              name: 'Linux time synchronization query failed'
              priority: AVERAGE
              description: 'The NTP query to {$NTP.SERVER} failed or returned an unsynchronised/invalid response on the last 3 attempts. The clock offset cannot be verified.'
        - uuid: 6f0e1d2c3b4a4968b7665544332211aa
          name: 'Linux NTP server stratum'
          type: DEPENDENT
          key: linux.ntp.sync.stratum
          delay: '0'
          history: 7d
          value_type: UNSIGNED
          description: 'Stratum of {$NTP.SERVER} (1 = primary reference; lower is closer to an authoritative source). Only present when the query succeeds.'
          preprocessing:
            - type: JSONPATH
              parameters:
                - $.stratum
              error_handler: DISCARD_VALUE
          master_item:
            key: 'linux.ntp.sync[{$NTP.SERVER}]'
        - uuid: 5a4b3c2d1e0f4987b665544332211009
          name: 'Linux NTP round-trip time'
          type: DEPENDENT
          key: linux.ntp.sync.rtt
          delay: '0'
          history: 7d
          value_type: FLOAT
          units: ms
          description: 'Network round-trip time of the NTP query to {$NTP.SERVER}. High RTT reduces offset accuracy.'
          preprocessing:
            - type: JSONPATH
              parameters:
                - $.rtt_ms
              error_handler: DISCARD_VALUE
          master_item:
            key: 'linux.ntp.sync[{$NTP.SERVER}]'
        - uuid: 25cb718661c34928b9783115da9eb61a
          name: 'Linux NTP server used'
          type: DEPENDENT
          key: linux.ntp.sync.server
          delay: '0'
          history: 1d
          value_type: TEXT
          trends: '0'
          description: 'The NTP server the offset was measured against.'
          preprocessing:
            - type: JSONPATH
              parameters:
                - $.ntp_server
              error_handler: DISCARD_VALUE
          master_item:
            key: 'linux.ntp.sync[{$NTP.SERVER}]'
      tags:
        - tag: target
          value: time
      macros:
        - macro: '{$NTP.CHECK.INTERVAL}'
          value: 2m
          description: 'How often the clock offset is measured.'
        - macro: '{$NTP.NODATA}'
          value: 10m
          description: 'Raise a warning if no NTP measurement is received within this window.'
        - macro: '{$NTP.OFFSET.CRIT}'
          value: '2'
          description: 'Critical clock offset in seconds. Recommended 2s (well inside the 5-minute Kerberos tolerance; tighten for latency-sensitive workloads).'
        - macro: '{$NTP.OFFSET.WARN}'
          value: '0.5'
          description: 'Warning clock offset in seconds. Recommended 0.5s for catching drift early; raise to ~1s if querying a public pool over the WAN.'
        - macro: '{$NTP.SERVER}'
          value: pool.ntp.org
          description: 'Reference NTP server/pool. In an AD domain set this to the PDC Emulator.'
      valuemaps:
        - uuid: b2c3d4e5f60748293a4b5c6d7e8f9012
          name: 'NTP success'
          mappings:
            - value: '0'
              newvalue: Failed
            - value: '1'
              newvalue: Success
