# Windows Recurring Event Error (Go plugin)
# Key: winevent.recurring[logs,period,maxEvents,minCount]
#   logs      - comma-separated event log names (default "System,Application")
#   period    - lookback window: Go duration like 24h / 90m, or a number of hours (default 24h)
#   maxEvents - per-log cap on events scanned (default 2000)
#   minCount  - minimum occurrences for a signature to be reported (default 2)
#
# Returns a JSON array of recurring Critical/Error event signatures, each:
#   {"Log","Level","EventID","Source","Count","FirstSeen","LastSeen","Message"}
#
# Run manually for testing:
#   & "C:\Program Files\Zabbix Agent 2\zabbix-agent2-windows-recurring-event.exe" --standalone --verbose
#   & "C:\Program Files\Zabbix Agent 2\zabbix-agent2-windows-recurring-event.exe" --standalone --verbose System,Application 24h
#
# Test through Agent 2:
#   & "C:\Program Files\Zabbix Agent 2\zabbix_agent2.exe" -c "C:\Program Files\Zabbix Agent 2\zabbix_agent2.conf" -t winevent.recurring
#
# Notes:
#   - The plugin shells out to Windows PowerShell (Get-WinEvent) and groups events
#     by (Log, Source, EventID, Level), counting occurrences within the lookback
#     window. Reading the Security log requires the agent to run with sufficient
#     privileges (LocalSystem does).
#   - Output is always a valid JSON array (never null); the number of signatures
#     is capped and messages are trimmed so the value stays well-formed and bounded.
#   - On a transient collection failure the plugin serves the last good payload for
#     up to 30 minutes so the dependent LLD items do not flap.
#   - Irrelevant events are filtered in the template via the {$WINEVENT.IGNORE} macro;
#     the recurrence threshold and lookback window are the {$WINEVENT.RECURRING.COUNT}
#     and {$WINEVENT.PERIOD} macros.
Plugins.WinEventRecurring.System.Path=C:\Program Files\Zabbix Agent 2\zabbix-agent2-windows-recurring-event.exe
