# Windows Time Synchronization (Go plugin)
# Key: windows.ntp.sync[server]
#
# Returns JSON: success, ntp_server, local_ts, ntp_ts, diff_seconds (clock offset,
# positive = local clock behind), stratum, rtt_ms, attempts, error.
#
# Run manually for testing:
#   & "C:\Program Files\Zabbix Agent 2\zabbix-agent2-windows-ntpsync.exe" --standalone
#   & "C:\Program Files\Zabbix Agent 2\zabbix-agent2-windows-ntpsync.exe" --standalone time.windows.com
#
# Test through Agent 2:
#   & "C:\Program Files\Zabbix Agent 2\zabbix_agent2.exe" -c "C:\Program Files\Zabbix Agent 2\zabbix_agent2.conf" -t "windows.ntp.sync[pool.ntp.org]"
#
# Notes:
#   - Set the template macro {$NTP.SERVER} to the reference server. In an Active
#     Directory domain this should be the PDC Emulator; on the PDC Emulator itself,
#     point it at the external source it synchronises with.
#   - The plugin makes up to 3 validated attempts (3s timeout each) and rejects
#     Kiss-of-Death and unsynchronised/stratum-0/16 responses.
Plugins.WindowsNTPSync.System.Path=C:\Program Files\Zabbix Agent 2\zabbix-agent2-windows-ntpsync.exe
