zabbix_export:
  version: '7.0'
  template_groups:
    - uuid: 7df96b18c230490a9a0a9e2307226338
      name: Templates
  templates:
    - uuid: aa1f987eaa9f4e6b989a78bf2c293492
      template: 'Windows Service Listning Port Zabbix Agent Active'
      name: 'Windows Service Listning Port Zabbix Agent Active'
      vendor:
        name: Keberneth
        version: 7.0-0-0
      groups:
        - name: Templates
      items:
        - uuid: 1af87cf81dbe40c5b361597d9171bfee
          name: 'Listening Services JSON'
          type: ZABBIX_ACTIVE
          key: service.listening.port
          delay: '{$SVC_PORT.DELAY}'
          history: 7d
          value_type: TEXT
          trends: '0'
          timeout: 45s
          description: 'JSON inventory of listening TCP ports and their owning services/processes.'
          triggers:
            - uuid: c3d4e5f60718293a4b5c6d7e8f901a2b
              expression: 'nodata(/Windows Service Listning Port Zabbix Agent Active/service.listening.port,{$SVC_PORT.NODATA})=1'
              name: 'Windows listening-port inventory is not being collected'
              priority: WARNING
              description: 'No listening-port inventory has been received within {$SVC_PORT.NODATA} (agent down, plugin missing, or exe path misconfigured).'
      macros:
        - macro: '{$SVC_PORT.DELAY}'
          value: 1h
          description: 'How often the listening-port inventory is collected. Lower than the old 1d default so newly opened ports are detected sooner.'
        - macro: '{$SVC_PORT.NODATA}'
          value: 2h
          description: 'Raise a warning if no listening-port inventory is received within this window (keep > {$SVC_PORT.DELAY}).'
