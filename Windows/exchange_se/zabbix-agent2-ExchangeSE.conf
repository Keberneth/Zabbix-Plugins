# Microsoft Exchange SE (Go plugin)
# Key: exchange.se.status
#
# Run manually for testing (as an administrator, or via PsExec as SYSTEM to
# match the agent service account):
#   & "C:\Program Files\Zabbix Agent 2\zabbix-agent2-exchange-se.exe" --standalone --verbose
#
# Test through Agent 2:
#   & "C:\Program Files\Zabbix Agent 2\zabbix_agent2.exe" -c "C:\Program Files\Zabbix Agent 2\zabbix_agent2.conf" -t exchange.se.status
#
# Notes:
#   - Deploy the plugin locally on each Exchange SE Mailbox server.
#   - The plugin is strictly read-only: it only runs Get-* cmdlets,
#     Test-ReplicationHealth and local https://localhost/<vdir>/healthcheck.htm
#     GET probes. It never changes any Exchange or Windows configuration.
#   - The collector loads the Exchange Management Shell snap-in from inside the
#     Go binary. Running the Zabbix Agent 2 service as LocalSystem on the
#     Exchange server works out of the box; a custom service account instead
#     needs the View-Only Organization Management RBAC role (remoting fallback).
#   - A full collection can take 30-60 seconds (snap-in load plus cmdlets).
#     The template polls every 5 minutes by default and sets a 120s item timeout.
#   - On transient collection failures the plugin serves the last good payload
#     for up to 30 minutes and marks it as cached in the JSON so the template
#     can warn without flapping.
Plugins.ExchangeSE.System.Path=C:\Program Files\Zabbix Agent 2\zabbix-agent2-exchange-se.exe
