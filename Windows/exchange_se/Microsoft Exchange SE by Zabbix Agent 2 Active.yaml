zabbix_export:
  version: '7.0'
  template_groups:
    - uuid: a23c9f3c42384b3ea9676e23fb9dcdf0
      name: Templates
  templates:
    - uuid: 5bc59fc705594acbb9377afed72cfac8
      template: 'Microsoft Exchange SE by Zabbix Agent 2 Active'
      name: 'Microsoft Exchange SE by Zabbix Agent 2 Active'
      description: |
        Functional and health monitoring for Microsoft Exchange SE (Subscription Edition) Mailbox servers via the ExchangeSE Zabbix Agent 2 loadable Go plugin.

        Covers: transport queues (including a dedicated "queue is growing and nothing is sent" trigger), transport back pressure, Exchange certificates, mailbox database and DAG copy health, backup age, Managed Availability health sets, Exchange services, server component states / maintenance mode, protocol health check pages (OWA, ECP, EWS, ActiveSync, Autodiscover, MAPI, OAB, RPC, PowerShell) and DAG replication health.

        Requirements:
        - zabbix-agent2-exchange-se.exe plugin deployed on the Exchange server (see zabbix-agent2-ExchangeSE.conf).
        - Zabbix Agent 2 service running as LocalSystem on the Exchange server (default), or as a service account holding the View-Only Organization Management RBAC role.
        - Complements the perf-counter based "Microsoft Exchange Server 2016 by Zabbix agent active" template; link both to the host for full coverage.

        The plugin is strictly read-only. All alert thresholds and windows are adjustable via {$EXCH.*} macros, many with per-object context support (for example {$EXCH.DB.COPYQUEUE.MAX:"DB01"}).
      vendor:
        name: Keberneth
        version: 7.0.1
      groups:
        - name: Templates
      items:
        - uuid: 3806c048c4844e5ba0f4fad43316bda5
          name: 'Exchange SE server data JSON'
          type: ZABBIX_ACTIVE
          key: exchange.se.status
          delay: '{$EXCH.COLLECT.INTERVAL}'
          history: '0'
          value_type: TEXT
          trends: '0'
          description: |
            Master item returned by the ExchangeSE Go plugin.
            The rest of the template uses dependent items and dependent discovery.
            A full collection loads the Exchange Management Shell and can take 30-60 seconds.
          timeout: 120s
          triggers:
            - uuid: 2916861458874f15bf4097cdd26dad7a
              expression: 'nodata(/Microsoft Exchange SE by Zabbix Agent 2 Active/exchange.se.status,{$EXCH.NODATA.WINDOW})=1'
              name: 'Exchange SE data collection stopped'
              priority: AVERAGE
              description: 'No Exchange JSON payload received within {$EXCH.NODATA.WINDOW}. Check the Zabbix Agent 2 service and run the plugin with --standalone on the server.'
        - uuid: c7615c108402412d8633a58d99a48fea
          name: 'Exchange SE Collection age'
          type: DEPENDENT
          key: exchange.se.collection.age
          delay: '0'
          units: s
          preprocessing:
            - type: JAVASCRIPT
              parameters:
                - |
                  var j = JSON.parse(value);
                  return (j && j.CollectionAgeSeconds !== undefined && j.CollectionAgeSeconds !== null) ? j.CollectionAgeSeconds : null;
          master_item:
            key: exchange.se.status
        - uuid: 52f9dc6a3c9143499451889f5daf00e4
          name: 'Exchange SE Collection error'
          type: DEPENDENT
          key: exchange.se.collection.error
          delay: '0'
          value_type: TEXT
          trends: '0'
          preprocessing:
            - type: JAVASCRIPT
              parameters:
                - |
                  var j = JSON.parse(value);
                  return (j && j.CollectionError !== undefined && j.CollectionError !== null) ? j.CollectionError : "";
          master_item:
            key: exchange.se.status
        - uuid: 4bc96bbcc54a4597bdf42f2d36f7a317
          name: 'Exchange SE Collection mode'
          type: DEPENDENT
          key: exchange.se.collection.mode
          delay: '0'
          value_type: TEXT
          trends: '0'
          preprocessing:
            - type: JAVASCRIPT
              parameters:
                - |
                  var j = JSON.parse(value);
                  return (j && j.CollectionMode) ? j.CollectionMode : null;
          master_item:
            key: exchange.se.status
        - uuid: 1abd69a0412941c19c821d1ea6989d7a
          name: 'Exchange SE Collector partial errors'
          type: DEPENDENT
          key: exchange.se.collector.errors
          delay: '0'
          value_type: TEXT
          trends: '0'
          description: 'Areas the collector could not read this cycle (one line per area). Empty when everything was collected.'
          preprocessing:
            - type: JAVASCRIPT
              parameters:
                - |
                  var j = JSON.parse(value);
                  if (j && Array.isArray(j.Errors) && j.Errors.length) {
                    return j.Errors.join("\n");
                  }
                  return "";
          master_item:
            key: exchange.se.status
          triggers:
            - uuid: 618e81110487411f812dc45a765807c6
              expression: 'length(last(/Microsoft Exchange SE by Zabbix Agent 2 Active/exchange.se.collector.errors))>0'
              name: 'Exchange SE collector reported errors for some areas'
              priority: WARNING
              description: 'One or more collection areas failed (see the item value for details). Other metrics from failed areas may be missing or stale.'
        - uuid: 7c2e7eb7fd894e4183cf07626de2b194
          name: 'Exchange SE Version'
          type: DEPENDENT
          key: exchange.se.server.version
          delay: '0'
          value_type: TEXT
          trends: '0'
          preprocessing:
            - type: JAVASCRIPT
              parameters:
                - |
                  var j = JSON.parse(value);
                  return (j && j.Exchange && j.Exchange.Version) ? j.Exchange.Version : null;
            - type: DISCARD_UNCHANGED_HEARTBEAT
              parameters:
                - 1d
          master_item:
            key: exchange.se.status
        - uuid: ff28d96e5e5243f88910fb3c411c146e
          name: 'Exchange SE Edition'
