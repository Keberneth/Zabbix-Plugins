      macros:
        - macro: '{$EXCH.ALERT.IN.MAINTENANCE}'
          value: '0'
          description: 'Set to 1 to keep component and virtual directory alerts firing while the server is in maintenance mode.'
        - macro: '{$EXCH.BACKUP.ALERT}'
          value: '1'
          description: 'Set to 0 to disable database backup age alerts. Supports per-database context, e.g. {$EXCH.BACKUP.ALERT:"DB01"}.'
        - macro: '{$EXCH.BACKUP.MAX.AGE.HOURS}'
          value: '36'
          description: 'Maximum accepted hours since the last full backup of a database. Supports per-database context.'
        - macro: '{$EXCH.BP.PROBLEM.WINDOW}'
          value: '10m'
          description: 'How long transport back pressure must persist before the trigger is raised.'
        - macro: '{$EXCH.CACHED.WARN.SEC}'
          value: '900'
          description: 'Raise a warning if the plugin is serving cached Exchange data older than this many seconds.'
        - macro: '{$EXCH.CERT.CRIT.DAYS}'
          value: '7'
          description: 'High severity certificate expiry threshold in days. Supports per-certificate context by thumbprint.'
        - macro: '{$EXCH.CERT.EXCLUDE.MATCHES}'
          value: '^$'
          description: 'Regex of certificate subjects that should not be discovered.'
        - macro: '{$EXCH.CERT.SERVICES.MATCHES}'
          value: '.*'
          description: 'Regex the certificate bound-services string must match to be discovered. Example: IIS|SMTP to only monitor certificates bound to client access or mail flow.'
        - macro: '{$EXCH.CERT.WARN.DAYS}'
          value: '30'
          description: 'Warning certificate expiry threshold in days. Supports per-certificate context by thumbprint.'
        - macro: '{$EXCH.COLLECT.INTERVAL}'
          value: 5m
          description: 'How often the Go plugin collects the Exchange snapshot. A full collection takes 30-60 seconds on a typical server.'
        - macro: '{$EXCH.COMPONENT.EXCLUDE.MATCHES}'
          value: '^(ForwardSyncDaemon|ProvisioningRps)$'
          description: 'Regex of server components that should not be discovered. The defaults are Inactive by design on-premises.'
        - macro: '{$EXCH.COMPONENT.PROBLEM.WINDOW}'
          value: '15m'
          description: 'How long a component must stay Inactive before the trigger is raised.'
        - macro: '{$EXCH.DB.COPYQUEUE.MAX}'
          value: '50'
          description: 'Maximum accepted database copy queue length. Supports per-database context, e.g. {$EXCH.DB.COPYQUEUE.MAX:"DB01"}.'
        - macro: '{$EXCH.DB.INDEX.PROBLEM.WINDOW}'
          value: '30m'
          description: 'How long the content index must stay unhealthy before the trigger is raised.'
        - macro: '{$EXCH.DB.PROBLEM.WINDOW}'
          value: '10m'
          description: 'How long a database copy must stay unhealthy before the copy/mount triggers are raised.'
        - macro: '{$EXCH.DB.QUEUE.PROBLEM.WINDOW}'
          value: '15m'
          description: 'How long copy/replay queue lengths must stay above their thresholds before the triggers are raised.'
        - macro: '{$EXCH.DB.REPLAYQUEUE.MAX}'
          value: '200'
          description: 'Maximum accepted database replay queue length. Raise per database for intentionally lagged copies, e.g. {$EXCH.DB.REPLAYQUEUE.MAX:"DB01"}.'
        - macro: '{$EXCH.EVENTLOG.INTERVAL}'
          value: 5m
          description: 'Polling interval for Windows eventlog[] items.'
        - macro: '{$EXCH.EVENTLOG.WINDOW}'
          value: 30m
          description: 'How long eventlog-based triggers stay open after the matching event ID was seen.'
        - macro: '{$EXCH.HEALTHSET.EXCLUDE.MATCHES}'
          value: '^$'
          description: 'Regex of Managed Availability health sets that should not be discovered.'
        - macro: '{$EXCH.HEALTHSET.PROBLEM.WINDOW}'
          value: '30m'
          description: 'How long a health set must stay Unhealthy before the trigger is raised. Managed Availability flaps by design; keep this generous.'
        - macro: '{$EXCH.NODATA.WINDOW}'
          value: '30m'
          description: 'Raise a collection problem if no Exchange JSON is received inside this window.'
        - macro: '{$EXCH.QUEUE.DEPTH.HIGH}'
          value: '1000'
          description: 'High severity threshold for the total mail queue depth.'
        - macro: '{$EXCH.QUEUE.DEPTH.WARN}'
          value: '100'
          description: 'Warning threshold for the total mail queue depth.'
        - macro: '{$EXCH.QUEUE.POISON.MAX}'
          value: '0'
          description: 'Maximum accepted number of messages in the poison queue.'
        - macro: '{$EXCH.QUEUE.PROBLEM.WINDOW}'
          value: '15m'
          description: 'How long queue depth/retry conditions must persist before their triggers are raised.'
        - macro: '{$EXCH.QUEUE.RETRY.MAX}'
          value: '0'
          description: 'Maximum accepted number of queues in Retry status.'
        - macro: '{$EXCH.QUEUE.STALL.MIN.DEPTH}'
          value: '50'
          description: 'Minimum sustained queue depth for the "queue is growing and nothing is sent" trigger. Set this above the level normal short bursts reach in your environment.'
        - macro: '{$EXCH.QUEUE.STALL.WINDOW}'
          value: '30m'
          description: 'Evaluation window for the "queue is growing and nothing is sent" trigger: outgoing rate must be 0 and depth above {$EXCH.QUEUE.STALL.MIN.DEPTH} for this whole period.'
        - macro: '{$EXCH.QUEUE.SUBMISSION.MAX}'
          value: '100'
          description: 'Maximum accepted submission queue depth.'
        - macro: '{$EXCH.QUEUE.UNREACHABLE.MAX}'
          value: '0'
          description: 'Maximum accepted number of messages in the unreachable queue.'
        - macro: '{$EXCH.REPL.PROBLEM.WINDOW}'
          value: '15m'
          description: 'How long DAG replication health checks must keep failing before the trigger is raised.'
        - macro: '{$EXCH.SERVICE.EXCLUDE.MATCHES}'
          value: '^(MSExchangeNotificationsBroker)$'
          description: 'Regex of service names that should not be discovered. MSExchangeNotificationsBroker is automatic but commonly stopped by design.'
        - macro: '{$EXCH.SERVICE.PROBLEM.WINDOW}'
          value: '10m'
          description: 'How long an automatic-start service must stay stopped before the trigger is raised.'
        - macro: '{$EXCH.VDIR.EXCLUDE.MATCHES}'
          value: '^$'
          description: 'Regex of protocol names (OWA, ECP, EWS, ActiveSync, Autodiscover, MAPI, OAB, RPC, PowerShell) that should not be discovered.'
        - macro: '{$EXCH.VDIR.PROBLEM.WINDOW}'
          value: '10m'
          description: 'How long a protocol health check must keep failing before the trigger is raised.'
