            key: exchange.se.status
        - uuid: 74750643126844b3b01ce947804635f4
          name: 'Exchange SE DAG name'
          type: DEPENDENT
          key: exchange.se.server.dag
          delay: '0'
          value_type: TEXT
          trends: '0'
          description: 'Empty when the server is not a DAG member.'
          preprocessing:
            - type: JAVASCRIPT
              parameters:
                - |
                  var j = JSON.parse(value);
                  return (j && j.Exchange && j.Exchange.DagName !== undefined && j.Exchange.DagName !== null) ? j.Exchange.DagName : "";
            - type: DISCARD_UNCHANGED_HEARTBEAT
              parameters:
                - 1d
          master_item:
            key: exchange.se.status
        - uuid: 319b4b8e6c0043f2b22be0da8123ac5e
          name: 'Exchange SE Maintenance mode'
          type: DEPENDENT
          key: exchange.se.server.maintenance
          delay: '0'
          description: 'Derived from the ServerWideOffline and HubTransport component states.'
          valuemap:
            name: 'Exchange SE yes/no'
          preprocessing:
            - type: JAVASCRIPT
              parameters:
                - |
                  var j = JSON.parse(value);
                  return (j && j.Exchange && j.Exchange.MaintenanceMode !== undefined && j.Exchange.MaintenanceMode !== null) ? j.Exchange.MaintenanceMode : null;
          master_item:
            key: exchange.se.status
          triggers:
            - uuid: 9c9cea3cf209483a989629194b8fd6dc
              expression: 'last(/Microsoft Exchange SE by Zabbix Agent 2 Active/exchange.se.server.maintenance)=1'
              name: 'Exchange SE server is in maintenance mode'
              priority: INFO
              manual_close: 'YES'
              description: 'ServerWideOffline or HubTransport is not Active. Component and virtual directory alerts are suppressed while this is the case (see {$EXCH.ALERT.IN.MAINTENANCE}).'
        - uuid: c68838048b35429ca31d512c1c5ebd8d
          name: 'Exchange SE Mail queue: total depth'
          type: DEPENDENT
          key: exchange.se.queue.total.depth
          delay: '0'
          description: 'Sum of messages in all local transport queues, excluding shadow redundancy and poison queues.'
          preprocessing:
            - type: JAVASCRIPT
              parameters:
                - |
                  var j = JSON.parse(value);
                  return (j && j.Summary && j.Summary.QueueTotalDepth !== undefined && j.Summary.QueueTotalDepth !== null) ? j.Summary.QueueTotalDepth : null;
          master_item:
            key: exchange.se.status
          triggers:
            - uuid: ecc407d8122d4d54a1c89efec0ad588c
              expression: 'min(/Microsoft Exchange SE by Zabbix Agent 2 Active/exchange.se.queue.total.depth,{$EXCH.QUEUE.PROBLEM.WINDOW})>{$EXCH.QUEUE.DEPTH.HIGH}'
              name: 'Exchange SE total mail queue depth is critically high'
              opdata: 'depth: {ITEM.LASTVALUE1}'
              priority: HIGH
            - uuid: ae1aeba7d54c450fbaba737b83ac2c8a
              expression: 'min(/Microsoft Exchange SE by Zabbix Agent 2 Active/exchange.se.queue.total.depth,{$EXCH.QUEUE.PROBLEM.WINDOW})>{$EXCH.QUEUE.DEPTH.WARN}'
              name: 'Exchange SE total mail queue depth is high'
              opdata: 'depth: {ITEM.LASTVALUE1}'
              priority: WARNING
              dependencies:
                - name: 'Exchange SE total mail queue depth is critically high'
                  expression: 'min(/Microsoft Exchange SE by Zabbix Agent 2 Active/exchange.se.queue.total.depth,{$EXCH.QUEUE.PROBLEM.WINDOW})>{$EXCH.QUEUE.DEPTH.HIGH}'
        - uuid: 04115d2e6f2f4e1f9597c4fab8bf07c8
          name: 'Exchange SE Mail queue: incoming rate'
          type: DEPENDENT
          key: exchange.se.queue.total.inrate
          delay: '0'
          value_type: FLOAT
          description: 'Messages per minute entering the local transport queues (sum over non-shadow queues).'
          preprocessing:
            - type: JAVASCRIPT
              parameters:
                - |
                  var j = JSON.parse(value);
                  return (j && j.Summary && j.Summary.QueueIncomingRate !== undefined && j.Summary.QueueIncomingRate !== null) ? j.Summary.QueueIncomingRate : null;
          master_item:
            key: exchange.se.status
        - uuid: 0354535f313e4e2a964ad8485deb1edf
          name: 'Exchange SE Mail queue: outgoing rate'
          type: DEPENDENT
          key: exchange.se.queue.total.outrate
          delay: '0'
          value_type: FLOAT
          description: 'Messages per minute leaving the local transport queues (sum over non-shadow queues). Sustained 0 while the queue has depth means mail is not being delivered.'
          preprocessing:
            - type: JAVASCRIPT
              parameters:
                - |
                  var j = JSON.parse(value);
                  return (j && j.Summary && j.Summary.QueueOutgoingRate !== undefined && j.Summary.QueueOutgoingRate !== null) ? j.Summary.QueueOutgoingRate : null;
          master_item:
            key: exchange.se.status
        - uuid: 3ac7efd459974b47815d5571bbdd868e
          name: 'Exchange SE Mail queue: queues in retry'
          type: DEPENDENT
          key: exchange.se.queue.retry.count
          delay: '0'
          description: 'Number of non-shadow queues in Retry status. The problem queues detail item lists them with their last error.'
          preprocessing:
            - type: JAVASCRIPT
              parameters:
                - |
                  var j = JSON.parse(value);
                  return (j && j.Summary && j.Summary.QueueRetryCount !== undefined && j.Summary.QueueRetryCount !== null) ? j.Summary.QueueRetryCount : null;
          master_item:
            key: exchange.se.status
          triggers:
            - uuid: 76c2e9f2d92e4ef59fb40928cfb15d6b
              expression: 'min(/Microsoft Exchange SE by Zabbix Agent 2 Active/exchange.se.queue.retry.count,{$EXCH.QUEUE.PROBLEM.WINDOW})>{$EXCH.QUEUE.RETRY.MAX}'
              name: 'Exchange SE mail queues are in Retry status'
              opdata: 'queues in retry: {ITEM.LASTVALUE1}'
              priority: WARNING
              description: 'One or more delivery queues cannot connect to their next hop. Check the "Mail queue: problem queues detail" item for the queue names and last errors.'
        - uuid: ab5c6c91c5ce47b480e3d373754a34e9
          name: 'Exchange SE Mail queue: submission queue depth'
          type: DEPENDENT
          key: exchange.se.queue.submission.depth
          delay: '0'
          description: 'Messages waiting for the categorizer. A sustained high submission queue usually means transport is stuck or under back pressure.'
          preprocessing:
            - type: JAVASCRIPT
              parameters:
                - |
                  var j = JSON.parse(value);
                  return (j && j.Summary && j.Summary.QueueSubmissionDepth !== undefined && j.Summary.QueueSubmissionDepth !== null) ? j.Summary.QueueSubmissionDepth : null;
          master_item:
            key: exchange.se.status
          triggers:
            - uuid: 6d163b41b57f4b9da9c6d7315b6b636f
              expression: 'min(/Microsoft Exchange SE by Zabbix Agent 2 Active/exchange.se.queue.submission.depth,{$EXCH.QUEUE.PROBLEM.WINDOW})>{$EXCH.QUEUE.SUBMISSION.MAX}'
              name: 'Exchange SE submission queue depth is high'
              opdata: 'depth: {ITEM.LASTVALUE1}'
              priority: AVERAGE
        - uuid: 79792ea233494367a8af10b4b27f4f7e
          name: 'Exchange SE Mail queue: poison queue depth'
          type: DEPENDENT
          key: exchange.se.queue.poison.depth
          delay: '0'
          description: 'Messages detected as harmful to the transport pipeline. These never leave by themselves and need manual review.'
          preprocessing:
            - type: JAVASCRIPT
              parameters:
                - |
                  var j = JSON.parse(value);
                  return (j && j.Summary && j.Summary.QueuePoisonDepth !== undefined && j.Summary.QueuePoisonDepth !== null) ? j.Summary.QueuePoisonDepth : null;
          master_item:
            key: exchange.se.status
          triggers:
            - uuid: ea77ae3c03da4156b7c9eab67a5eb0fd
              expression: 'last(/Microsoft Exchange SE by Zabbix Agent 2 Active/exchange.se.queue.poison.depth)>{$EXCH.QUEUE.POISON.MAX}'
              name: 'Exchange SE poison queue has messages'
              opdata: 'messages: {ITEM.LASTVALUE1}'
              priority: WARNING
        - uuid: 6bdee40db1db472bb57de615684b793f
          name: 'Exchange SE Mail queue: unreachable queue depth'
          type: DEPENDENT
          key: exchange.se.queue.unreachable.depth
          delay: '0'
          description: 'Messages that have no valid route. Usually caused by connector or routing configuration problems.'
          preprocessing:
            - type: JAVASCRIPT
              parameters:
                - |
                  var j = JSON.parse(value);
                  return (j && j.Summary && j.Summary.QueueUnreachableDepth !== undefined && j.Summary.QueueUnreachableDepth !== null) ? j.Summary.QueueUnreachableDepth : null;
          master_item:
            key: exchange.se.status
          triggers:
            - uuid: ee452dddccf54c23ba06f1fbf7a40e10
              expression: 'min(/Microsoft Exchange SE by Zabbix Agent 2 Active/exchange.se.queue.unreachable.depth,{$EXCH.QUEUE.PROBLEM.WINDOW})>{$EXCH.QUEUE.UNREACHABLE.MAX}'
              name: 'Exchange SE unreachable queue has messages'
              opdata: 'messages: {ITEM.LASTVALUE1}'
              priority: AVERAGE
        - uuid: 14861f0a8d864de49a68dfd2b570bbd3
          name: 'Exchange SE Mail queue: shadow queue depth'
          type: DEPENDENT
          key: exchange.se.queue.shadow.depth
          delay: '0'
          description: 'Shadow redundancy copies of messages being processed by other servers. Informational; excluded from the alerting totals.'
          preprocessing:
            - type: JAVASCRIPT
              parameters:
                - |
                  var j = JSON.parse(value);
                  return (j && j.Summary && j.Summary.QueueShadowDepth !== undefined && j.Summary.QueueShadowDepth !== null) ? j.Summary.QueueShadowDepth : null;
          master_item:
            key: exchange.se.status
        - uuid: 89005d2134aa41aa980ecf187f876526
          name: 'Exchange SE Mail queue: problem queues detail'
          type: DEPENDENT
          key: exchange.se.queue.problem.detail
          delay: '0'
          value_type: TEXT
          trends: '0'
          description: 'Human-readable list of non-empty, retrying or suspended queues with their last error. "OK" when there is nothing to report.'
          preprocessing:
            - type: JAVASCRIPT
              parameters:
                - |
                  var j = JSON.parse(value);
                  var lines = [];
                  if (j && Array.isArray(j.Queues)) {
                    for (var i = 0; i < j.Queues.length; i++) {
                      var q = j.Queues[i];
                      if (!q || q.IsShadow === 1) continue;
                      var status = q.Status || "";
                      if (status !== "Retry" && status !== "Suspended" && !(q.MessageCount > 0)) continue;
                      var line = (q.Identity || "?") + " [" + status + "] count=" + q.MessageCount + " nexthop=" + (q.NextHopDomain || "-");
                      if (q.LastError) line += " lastError=" + q.LastError;
                      lines.push(line);
                    }
                  }
                  if (j && j.Summary && j.Summary.QueueListTruncated === 1) lines.push("(queue list truncated)");
                  return lines.length ? lines.join("\n") : "OK";
          master_item:
            key: exchange.se.status
        - uuid: 0ba8d8aa5c4f4c618f50c0a1692a4638
          name: 'Exchange SE Services not running (count)'
          type: DEPENDENT
          key: exchange.se.services.notrunning.count
          delay: '0'
          description: 'Automatic-start Exchange related services that are not running. Per-service triggers come from service discovery.'
          preprocessing:
            - type: JAVASCRIPT
              parameters:
                - |
                  var j = JSON.parse(value);
                  return (j && j.Summary && j.Summary.ServicesNotRunning !== undefined && j.Summary.ServicesNotRunning !== null) ? j.Summary.ServicesNotRunning : null;
          master_item:
            key: exchange.se.status
        - uuid: 60983e40665d47d09249a6454d736fc4
          name: 'Exchange SE Services not running (detail)'
          type: DEPENDENT
          key: exchange.se.services.notrunning.detail
          delay: '0'
          value_type: TEXT
          trends: '0'
          preprocessing:
            - type: JAVASCRIPT
              parameters:
                - |
                  var j = JSON.parse(value);
                  var lines = [];
                  if (j && Array.isArray(j.Services)) {
                    for (var i = 0; i < j.Services.length; i++) {
                      var s = j.Services[i];
                      if (!s || s.AutoStart !== 1 || s.Running === 1) continue;
                      lines.push(s.Name + " (" + (s.DisplayName || s.Name) + "): " + (s.Status || "unknown"));
                    }
                  }
                  return lines.length ? lines.join("\n") : "OK";
          master_item:
            key: exchange.se.status
        - uuid: a0e218c673d4479185ded2f6f26aa2fd
          name: 'Exchange SE Components inactive (count)'
          type: DEPENDENT
          key: exchange.se.components.inactive.count
          delay: '0'
          description: 'Server components not in Active state, excluding ForwardSyncDaemon and ProvisioningRps which are inactive by default on-premises.'
          preprocessing:
            - type: JAVASCRIPT
              parameters:
                - |
                  var j = JSON.parse(value);
                  return (j && j.Summary && j.Summary.ComponentsInactive !== undefined && j.Summary.ComponentsInactive !== null) ? j.Summary.ComponentsInactive : null;
          master_item:
            key: exchange.se.status
        - uuid: 4ba40505a8604f61b2c20a252eb05555
          name: 'Exchange SE Health sets unhealthy (count)'
          type: DEPENDENT
          key: exchange.se.health.unhealthy.count
          delay: '0'
          description: 'Managed Availability health sets currently reporting Unhealthy.'
          preprocessing:
            - type: JAVASCRIPT
              parameters:
                - |
                  var j = JSON.parse(value);
                  return (j && j.Summary && j.Summary.HealthSetsUnhealthy !== undefined && j.Summary.HealthSetsUnhealthy !== null) ? j.Summary.HealthSetsUnhealthy : null;
          master_item:
            key: exchange.se.status
        - uuid: a753303b6abf46c28c411f6b95d647e2
          name: 'Exchange SE Health sets unhealthy (detail)'
          type: DEPENDENT
          key: exchange.se.health.unhealthy.detail
          delay: '0'
          value_type: TEXT
          trends: '0'
          preprocessing:
            - type: JAVASCRIPT
              parameters:
                - |
                  var j = JSON.parse(value);
                  var names = [];
                  if (j && Array.isArray(j.HealthSets)) {
                    for (var i = 0; i < j.HealthSets.length; i++) {
                      var h = j.HealthSets[i];
                      if (h && h.AlertRaw === 0) names.push(h.Name);
                    }
                  }
                  return names.length ? names.join(", ") : "OK";
          master_item:
            key: exchange.se.status
        - uuid: 2d04be69a5214ebfaac6f6d55bf0cd5f
          name: 'Exchange SE Transport back pressure'
          type: DEPENDENT
          key: exchange.se.backpressure.state
          delay: '0'
          description: 'Worst resource pressure level reported by the transport ResourceThrottling diagnostics. Under Medium/High pressure Exchange starts rejecting or throttling mail flow.'
          valuemap:
            name: 'Exchange SE back pressure'
          preprocessing:
            - type: JAVASCRIPT
              parameters:
                - |
                  var j = JSON.parse(value);
                  return (j && j.BackPressure && j.BackPressure.StateRaw !== undefined && j.BackPressure.StateRaw !== null) ? j.BackPressure.StateRaw : null;
          master_item:
            key: exchange.se.status
          triggers:
            - uuid: 407a198b426646b6a1cff2ff53eb8ddc
              expression: 'min(/Microsoft Exchange SE by Zabbix Agent 2 Active/exchange.se.backpressure.state,{$EXCH.BP.PROBLEM.WINDOW})=2'
              name: 'Exchange SE transport back pressure is High'
              priority: HIGH
              description: 'Transport is rejecting new mail because a resource (disk space, memory, queue database) is critically constrained. See the back pressure detail item for the exact resource.'
            - uuid: ca19e8f7bb204eb4bb0634a6130e5411
              expression: 'min(/Microsoft Exchange SE by Zabbix Agent 2 Active/exchange.se.backpressure.state,{$EXCH.BP.PROBLEM.WINDOW})>=1'
              name: 'Exchange SE transport is under back pressure'
              priority: WARNING
              description: 'Transport is throttling mail flow due to resource pressure. See the back pressure detail item for the exact resource.'
              dependencies:
                - name: 'Exchange SE transport back pressure is High'
                  expression: 'min(/Microsoft Exchange SE by Zabbix Agent 2 Active/exchange.se.backpressure.state,{$EXCH.BP.PROBLEM.WINDOW})=2'
        - uuid: 32694ae90fb44ec4af465dfd6c1b276c
          name: 'Exchange SE Transport back pressure detail'
          type: DEPENDENT
          key: exchange.se.backpressure.detail
          delay: '0'
          value_type: TEXT
          trends: '0'
          preprocessing:
            - type: JAVASCRIPT
              parameters:
                - |
                  var j = JSON.parse(value);
                  var lines = [];
                  if (j && j.BackPressure && Array.isArray(j.BackPressure.Resources)) {
                    for (var i = 0; i < j.BackPressure.Resources.length; i++) {
                      var r = j.BackPressure.Resources[i];
                      if (!r || !r.Current || r.Current === "Low") continue;
                      lines.push(r.Resource + " = " + r.Current + (r.Previous ? " (was " + r.Previous + ")" : ""));
                    }
                  }
                  return lines.length ? lines.join("\n") : "OK";
          master_item:
            key: exchange.se.status
        - uuid: f6993ef68a51465c8f934e632bceb411
          name: 'Exchange SE Replication health failed checks'
          type: DEPENDENT
          key: exchange.se.replication.failed.count
          delay: '0'
          description: 'Number of failed Test-ReplicationHealth checks. Always 0 on servers that are not DAG members.'
          preprocessing:
            - type: JAVASCRIPT
              parameters:
                - |
                  var j = JSON.parse(value);
                  return (j && j.Summary && j.Summary.ReplicationChecksFailed !== undefined && j.Summary.ReplicationChecksFailed !== null) ? j.Summary.ReplicationChecksFailed : null;
          master_item:
            key: exchange.se.status
          triggers:
            - uuid: faee646677984a62b57a1586dda9512b
              expression: 'min(/Microsoft Exchange SE by Zabbix Agent 2 Active/exchange.se.replication.failed.count,{$EXCH.REPL.PROBLEM.WINDOW})>0'
              name: 'Exchange SE DAG replication health checks are failing'
              opdata: 'failed checks: {ITEM.LASTVALUE1}'
              priority: AVERAGE
