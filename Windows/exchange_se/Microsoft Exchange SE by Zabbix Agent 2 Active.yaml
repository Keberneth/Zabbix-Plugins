  triggers:
    - uuid: 227f232d9f074a3993073a39147143dd
      expression: 'min(/Microsoft Exchange SE by Zabbix Agent 2 Active/exchange.se.queue.total.outrate,{$EXCH.QUEUE.STALL.WINDOW})=0 and min(/Microsoft Exchange SE by Zabbix Agent 2 Active/exchange.se.queue.total.depth,{$EXCH.QUEUE.STALL.WINDOW})>={$EXCH.QUEUE.STALL.MIN.DEPTH}'
      name: 'Exchange SE mail queue is growing and nothing is being sent'
      opdata: 'outgoing rate: {ITEM.LASTVALUE1}, depth: {ITEM.LASTVALUE2}'
      priority: HIGH
      description: |
        For the whole {$EXCH.QUEUE.STALL.WINDOW} window the transport queues have held at least {$EXCH.QUEUE.STALL.MIN.DEPTH} messages while the outgoing rate stayed at 0 - mail is accumulating but nothing is being delivered.
        Check the "Mail queue: problem queues detail" item for the affected queues and their last error, transport back pressure, and the state of the MSExchangeTransport service.
    - uuid: b9a5b08d4fc441f9ac87ccdbf64376e3
      expression: 'last(/Microsoft Exchange SE by Zabbix Agent 2 Active/exchange.se.collection.mode)<>"live" and last(/Microsoft Exchange SE by Zabbix Agent 2 Active/exchange.se.collection.age)>={$EXCH.CACHED.WARN.SEC}'
      name: 'Exchange SE plugin is serving cached data'
      priority: WARNING
      description: 'Live collection keeps failing and the plugin is returning the last good snapshot. See the Collection error item for the live failure reason.'
