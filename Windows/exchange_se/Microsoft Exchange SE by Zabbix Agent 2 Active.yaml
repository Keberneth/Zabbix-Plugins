      discovery_rules:
        - uuid: 369080620bf5438c80257dbe4935d850
          name: 'Exchange SE service discovery'
          type: DEPENDENT
          key: exchange.se.services.discovery
          delay: '0'
          filter:
            conditions:
              - macro: '{#SERVICE.NAME}'
                value: '{$EXCH.SERVICE.EXCLUDE.MATCHES}'
                operator: NOT_MATCHES_REGEX
                formulaid: A
          description: 'Discovers automatic-start Exchange related Windows services from the plugin JSON.'
          item_prototypes:
            - uuid: e3aab1a6457d44dfb7a6990130310c38
              name: 'Exchange SE Service "{#SERVICE.DISPLAYNAME}" running'
              type: DEPENDENT
              key: 'exchange.se.service.running["{#SERVICE.NAME}"]'
              delay: '0'
              valuemap:
                name: 'Exchange SE running state'
              preprocessing:
                - type: JAVASCRIPT
                  parameters:
                    - |
                      var name = "{#SERVICE.NAME}";
                      var j = JSON.parse(value);
                      if (j && Array.isArray(j.Services)) {
                        for (var i = 0; i < j.Services.length; i++) {
                          var s = j.Services[i];
                          if (s && s.Name === name) {
                            return (s.Running !== undefined && s.Running !== null) ? s.Running : null;
                          }
                        }
                      }
                      return null;
              master_item:
                key: exchange.se.status
          trigger_prototypes:
            - uuid: aefe07652ca9428c942116737f0990b3
              expression: 'max(/Microsoft Exchange SE by Zabbix Agent 2 Active/exchange.se.service.running["{#SERVICE.NAME}"],{$EXCH.SERVICE.PROBLEM.WINDOW})=0'
              name: 'Exchange SE service "{#SERVICE.DISPLAYNAME}" is not running'
              priority: HIGH
          master_item:
            key: exchange.se.status
          preprocessing:
            - type: JAVASCRIPT
              parameters:
                - |
                  var j = JSON.parse(value);
                  var data = [];
                  if (j && Array.isArray(j.Services)) {
                    for (var i = 0; i < j.Services.length; i++) {
                      var s = j.Services[i];
                      if (!s || !s.Name || s.AutoStart !== 1) continue;
                      data.push({
                        "{#SERVICE.NAME}": s.Name,
                        "{#SERVICE.DISPLAYNAME}": s.DisplayName || s.Name
                      });
                    }
                  }
                  return JSON.stringify({data: data});
        - uuid: 6a10efcca1464c54bb2bfb25c20ee995
          name: 'Exchange SE component discovery'
          type: DEPENDENT
          key: exchange.se.components.discovery
          delay: '0'
          filter:
            conditions:
              - macro: '{#COMPONENT}'
                value: '{$EXCH.COMPONENT.EXCLUDE.MATCHES}'
                operator: NOT_MATCHES_REGEX
                formulaid: A
          description: 'Discovers Exchange server components (Get-ServerComponentState). ForwardSyncDaemon and ProvisioningRps are excluded by default because they are Inactive on-premises by design.'
          item_prototypes:
            - uuid: b915a684a9924568bf2fb85caa550bde
              name: 'Exchange SE Component "{#COMPONENT}" state'
              type: DEPENDENT
              key: 'exchange.se.component.state["{#COMPONENT}"]'
              delay: '0'
              valuemap:
                name: 'Exchange SE component state'
              preprocessing:
                - type: JAVASCRIPT
                  parameters:
                    - |
                      var name = "{#COMPONENT}";
                      var j = JSON.parse(value);
                      if (j && Array.isArray(j.Components)) {
                        for (var i = 0; i < j.Components.length; i++) {
                          var c = j.Components[i];
                          if (c && c.Name === name) {
                            return (c.StateRaw !== undefined && c.StateRaw !== null) ? c.StateRaw : null;
                          }
                        }
                      }
                      return null;
              master_item:
                key: exchange.se.status
          trigger_prototypes:
            - uuid: 87da6740be2d4f4c934da879032bd86f
              expression: 'max(/Microsoft Exchange SE by Zabbix Agent 2 Active/exchange.se.component.state["{#COMPONENT}"],{$EXCH.COMPONENT.PROBLEM.WINDOW})=0 and ({$EXCH.ALERT.IN.MAINTENANCE}=1 or last(/Microsoft Exchange SE by Zabbix Agent 2 Active/exchange.se.server.maintenance)=0)'
              name: 'Exchange SE component "{#COMPONENT}" is Inactive'
              priority: AVERAGE
              description: 'The component has been Inactive for the whole problem window and the server is not in maintenance mode.'
          master_item:
            key: exchange.se.status
          preprocessing:
            - type: JAVASCRIPT
              parameters:
                - |
                  var j = JSON.parse(value);
                  var data = [];
                  if (j && Array.isArray(j.Components)) {
                    for (var i = 0; i < j.Components.length; i++) {
                      var c = j.Components[i];
                      if (!c || !c.Name) continue;
                      data.push({
                        "{#COMPONENT}": c.Name
                      });
                    }
                  }
                  return JSON.stringify({data: data});
        - uuid: 2598bd7c6f6942bdac4787176264b6f0
          name: 'Exchange SE certificate discovery'
          type: DEPENDENT
          key: exchange.se.certs.discovery
          delay: '0'
          filter:
            conditions:
              - macro: '{#SUBJECT}'
                value: '{$EXCH.CERT.EXCLUDE.MATCHES}'
                operator: NOT_MATCHES_REGEX
                formulaid: A
              - macro: '{#SERVICES}'
                value: '{$EXCH.CERT.SERVICES.MATCHES}'
                formulaid: B
          description: 'Discovers all Exchange certificates on the server, including self-signed and the OAuth auth certificate (an expired auth certificate breaks OWA/ECP logons). Use {$EXCH.CERT.EXCLUDE.MATCHES} or {$EXCH.CERT.SERVICES.MATCHES} to narrow the set.'
          item_prototypes:
            - uuid: c9d66976832146c3aeffe53061ac9db0
              name: 'Exchange SE Certificate "{#SUBJECT}": days remaining'
              type: DEPENDENT
              key: 'exchange.se.cert.days["{#THUMBPRINT}"]'
              delay: '0'
              value_type: FLOAT
              description: 'Negative when the certificate is already expired. Thumbprint: {#THUMBPRINT}, services: {#SERVICES}.'
              preprocessing:
                - type: JAVASCRIPT
                  parameters:
                    - |
                      var thumbprint = "{#THUMBPRINT}";
                      var j = JSON.parse(value);
                      if (j && Array.isArray(j.Certificates)) {
                        for (var i = 0; i < j.Certificates.length; i++) {
                          var c = j.Certificates[i];
                          if (c && c.Thumbprint === thumbprint) {
                            return (c.DaysRemaining !== undefined && c.DaysRemaining !== null) ? c.DaysRemaining : null;
                          }
                        }
                      }
                      return null;
              master_item:
                key: exchange.se.status
            - uuid: 5336644dc4704ac486c886dacd401013
              name: 'Exchange SE Certificate "{#SUBJECT}": expires'
              type: DEPENDENT
              key: 'exchange.se.cert.notafter["{#THUMBPRINT}"]'
              delay: '0'
              value_type: TEXT
              trends: '0'
              preprocessing:
                - type: JAVASCRIPT
                  parameters:
                    - |
                      var thumbprint = "{#THUMBPRINT}";
                      var j = JSON.parse(value);
                      if (j && Array.isArray(j.Certificates)) {
                        for (var i = 0; i < j.Certificates.length; i++) {
                          var c = j.Certificates[i];
                          if (c && c.Thumbprint === thumbprint) {
                            return c.NotAfter || null;
                          }
                        }
                      }
                      return null;
                - type: DISCARD_UNCHANGED_HEARTBEAT
                  parameters:
                    - 1d
              master_item:
                key: exchange.se.status
            - uuid: b80b69d753c44fb2bfda3bc96bd997d1
              name: 'Exchange SE Certificate "{#SUBJECT}": bound services'
              type: DEPENDENT
              key: 'exchange.se.cert.services["{#THUMBPRINT}"]'
              delay: '0'
              value_type: TEXT
              trends: '0'
              preprocessing:
                - type: JAVASCRIPT
                  parameters:
                    - |
                      var thumbprint = "{#THUMBPRINT}";
                      var j = JSON.parse(value);
                      if (j && Array.isArray(j.Certificates)) {
                        for (var i = 0; i < j.Certificates.length; i++) {
                          var c = j.Certificates[i];
                          if (c && c.Thumbprint === thumbprint) {
                            return (c.Services !== undefined && c.Services !== null) ? c.Services : "";
                          }
                        }
                      }
                      return null;
                - type: DISCARD_UNCHANGED_HEARTBEAT
                  parameters:
                    - 1d
              master_item:
                key: exchange.se.status
          trigger_prototypes:
            - uuid: afb5b14493b442b58ce906a6e3ce700a
              expression: 'last(/Microsoft Exchange SE by Zabbix Agent 2 Active/exchange.se.cert.days["{#THUMBPRINT}"])<{$EXCH.CERT.CRIT.DAYS:"{#THUMBPRINT}"}'
              name: 'Exchange SE certificate "{#SUBJECT}" expires in less than {$EXCH.CERT.CRIT.DAYS:"{#THUMBPRINT}"} days'
              opdata: 'days remaining: {ITEM.LASTVALUE1}'
              priority: HIGH
              description: 'Services: {#SERVICES}. Thumbprint: {#THUMBPRINT}. Renew the certificate now; an expired certificate bound to IIS or SMTP breaks client access and mail flow.'
            - uuid: 0e427504d1eb48c281c5f34cc7fea7e7
              expression: 'last(/Microsoft Exchange SE by Zabbix Agent 2 Active/exchange.se.cert.days["{#THUMBPRINT}"])<{$EXCH.CERT.WARN.DAYS:"{#THUMBPRINT}"}'
              name: 'Exchange SE certificate "{#SUBJECT}" expires in less than {$EXCH.CERT.WARN.DAYS:"{#THUMBPRINT}"} days'
              opdata: 'days remaining: {ITEM.LASTVALUE1}'
              priority: WARNING
              description: 'Services: {#SERVICES}. Thumbprint: {#THUMBPRINT}.'
              dependencies:
                - name: 'Exchange SE certificate "{#SUBJECT}" expires in less than {$EXCH.CERT.CRIT.DAYS:"{#THUMBPRINT}"} days'
                  expression: 'last(/Microsoft Exchange SE by Zabbix Agent 2 Active/exchange.se.cert.days["{#THUMBPRINT}"])<{$EXCH.CERT.CRIT.DAYS:"{#THUMBPRINT}"}'
          master_item:
            key: exchange.se.status
          preprocessing:
            - type: JAVASCRIPT
              parameters:
                - |
                  var j = JSON.parse(value);
                  var data = [];
                  if (j && Array.isArray(j.Certificates)) {
                    for (var i = 0; i < j.Certificates.length; i++) {
                      var c = j.Certificates[i];
                      if (!c || !c.Thumbprint) continue;
                      data.push({
                        "{#THUMBPRINT}": c.Thumbprint,
                        "{#SUBJECT}": c.Subject || c.Thumbprint,
                        "{#SERVICES}": c.Services || "",
                        "{#SELFSIGNED}": c.IsSelfSigned
                      });
                    }
                  }
                  return JSON.stringify({data: data});
