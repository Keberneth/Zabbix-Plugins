zabbix_export:
  version: '7.0'
  template_groups:
    - uuid: 7df96b18c230490a9a0a9e2307226338
      name: Templates
  templates:
    - uuid: 685216637ec94d8db2d3af5a07493950
      template: 'AD DS User Monitoring Agent Active'
      name: 'AD DS User Monitoring Agent Active'
      description: |
        Monitor Active Directory users via Zabbix Agent 2 (Go plugin).
        
        Functions included:
        - Locked-out users (trigger per locked account)
        - Disabled users older than N days (trigger per disabled account)
        - Users with passwords expiring within N days (trigger per account)
        - Users with account expiration within N days (accountExpires) (trigger per account)
        - Inactive users whose last logon (lastLogonTimestamp) is older than N days (trigger per account)
        
        OU scoping:
        - Set {$AD.SEARCH.BASES} to a base DN (OU/container) to limit searches.
        - Multiple OUs are supported by separating base DNs with ';' or '|'.
          Example:
            OU=Admins,DC=example,DC=com;OU=Service Accounts,DC=example,DC=com
        
        Note on 'Execute now':
        - The master items in this template are Zabbix Agent (active) checks.
          Zabbix cannot 'Execute now' active checks, so running 'Execute now'
          on dependent discovery rules will show an error. Discovery works normally
          when the agent sends the master item value on schedule.
      vendor:
        name: Keberneth
        version: '7.0.0.5'
      groups:
        - name: Templates
      items:
        - uuid: 17048fd394844e4f8dd0c8ce60268fa1
          name: 'AD Disabled Users JSON'
          type: ZABBIX_ACTIVE
          key: 'DisabledUsers[{$AD.DISABLED.OLDER.THAN.DAYS},"{$AD.SEARCH.BASES}","{$AD.LDAP.SERVER}"]'
          delay: 24h
          value_type: TEXT
          trends: '0'
          status: DISABLED
          timeout: 90s
          triggers:
            - uuid: aa7f77de2abe434f87ab70d4fc758801
              expression: 'nodata(/AD DS User Monitoring Agent Active/DisabledUsers[{$AD.DISABLED.OLDER.THAN.DAYS},"{$AD.SEARCH.BASES}","{$AD.LDAP.SERVER}"],{$AD.NODATA.PERIOD})=1'
              name: 'AD monitoring: no data for disabled users'
              priority: WARNING
              description: 'The AD disabled-users master item has not received data within {$AD.NODATA.PERIOD}. Monitoring may be blind (DC unreachable, LDAP bind/permission failure, or the agent lost AD rights), so disabled-user triggers cannot be trusted.'
        - uuid: edbf9ec7c3bc484e8674fc7e7cce9c29
          name: 'AD Locked Users JSON'
          type: ZABBIX_ACTIVE
          key: 'LockedOutUsers["{$AD.SEARCH.BASES}","{$AD.LDAP.SERVER}"]'
          delay: 12h
          value_type: TEXT
          trends: '0'
          timeout: 90s
          triggers:
            - uuid: cfb8e7e1c36049ab99aa40a81e9cf5b9
              expression: 'nodata(/AD DS User Monitoring Agent Active/LockedOutUsers["{$AD.SEARCH.BASES}","{$AD.LDAP.SERVER}"],{$AD.NODATA.PERIOD})=1'
              name: 'AD monitoring: no data for locked-out users'
              priority: WARNING
              description: 'The AD locked-out-users master item has not received data within {$AD.NODATA.PERIOD}. Monitoring may be blind (DC unreachable, LDAP bind/permission failure, or the agent lost AD rights), so locked-out triggers cannot be trusted.'
        - uuid: 00c2d5fc82204ff994810d278a2426f5
          name: 'AD Password Expiring Users JSON'
          type: ZABBIX_ACTIVE
          key: 'PasswordExpiringUsers[{$AD.PASSWORD.EXPIRES.IN.DAYS},"{$AD.SEARCH.BASES}","{$AD.LDAP.SERVER}"]'
          delay: 12h
          value_type: TEXT
          trends: '0'
          timeout: 90s
          triggers:
            - uuid: 115808787e0744f49a24b18f8a0afe31
              expression: 'nodata(/AD DS User Monitoring Agent Active/PasswordExpiringUsers[{$AD.PASSWORD.EXPIRES.IN.DAYS},"{$AD.SEARCH.BASES}","{$AD.LDAP.SERVER}"],{$AD.NODATA.PERIOD})=1'
              name: 'AD monitoring: no data for password-expiring users'
              priority: WARNING
              description: 'The AD password-expiring-users master item has not received data within {$AD.NODATA.PERIOD}. Monitoring may be blind (DC unreachable, LDAP bind/permission failure, or the agent lost AD rights), so password-expiry triggers cannot be trusted.'
        - uuid: c8d26984c0ff4d7d8064e1d80a183e31
          name: 'AD Users About To Be Disabled JSON'
          type: ZABBIX_ACTIVE
          key: 'UsersAboutToBeDisabled[{$AD.ACCOUNT.EXPIRES.IN.DAYS},"{$AD.SEARCH.BASES}","{$AD.LDAP.SERVER}"]'
          delay: 12h
          value_type: TEXT
          trends: '0'
          timeout: 90s
          triggers:
            - uuid: 55c1625347e04e999851ece2db250188
              expression: 'nodata(/AD DS User Monitoring Agent Active/UsersAboutToBeDisabled[{$AD.ACCOUNT.EXPIRES.IN.DAYS},"{$AD.SEARCH.BASES}","{$AD.LDAP.SERVER}"],{$AD.NODATA.PERIOD})=1'
              name: 'AD monitoring: no data for users about to be disabled (account expiration)'
              priority: WARNING
              description: 'The AD account-expiration master item has not received data within {$AD.NODATA.PERIOD}. Monitoring may be blind (DC unreachable, LDAP bind/permission failure, or the agent lost AD rights), so account-expiration triggers cannot be trusted.'
        - uuid: 0d921e2164424f728b73c0f3265d4378
          name: 'AD Inactive Users JSON'
          type: ZABBIX_ACTIVE
          key: 'InactiveUsers[{$AD.INACTIVE.OLDER.THAN.DAYS},"{$AD.SEARCH.BASES}","{$AD.LDAP.SERVER}"]'
          delay: 24h
          value_type: TEXT
          trends: '0'
          timeout: 90s
          triggers:
            - uuid: 4f2a1157940146da8811332417fa964c
              expression: 'nodata(/AD DS User Monitoring Agent Active/InactiveUsers[{$AD.INACTIVE.OLDER.THAN.DAYS},"{$AD.SEARCH.BASES}","{$AD.LDAP.SERVER}"],{$AD.NODATA.PERIOD})=1'
              name: 'AD monitoring: no data for inactive users'
              priority: WARNING
              description: 'The AD inactive-users master item has not received data within {$AD.NODATA.PERIOD}. Monitoring may be blind (DC unreachable, LDAP bind/permission failure, or the agent lost AD rights), so inactive-user triggers cannot be trusted.'
        - uuid: d9fd90f336a74024a6eded4a64ba0560
          name: 'AD Inactive Users Count'
          type: DEPENDENT
          key: InactiveUsersCount
          delay: '0'
          value_type: UNSIGNED
          description: 'Number of enabled AD users whose last logon is older than {$AD.INACTIVE.OLDER.THAN.DAYS} days.'
          preprocessing:
            - type: JAVASCRIPT
              parameters:
                - |
                  var text = (value || "").trim();
                  if (!text) return 0;

                  var parsed;
                  try { parsed = JSON.parse(text); } catch (e) { return 0; }

                  var isArray = Object.prototype.toString.call(parsed) === "[object Array]";
                  var arr = isArray ? parsed : (parsed ? [parsed] : []);
                  return arr.length;
          master_item:
            key: 'InactiveUsers[{$AD.INACTIVE.OLDER.THAN.DAYS},"{$AD.SEARCH.BASES}","{$AD.LDAP.SERVER}"]'
          triggers:
            - uuid: 40c897e6be464be0a358bc403f98aca8
              expression: 'last(/AD DS User Monitoring Agent Active/InactiveUsersCount)>{$AD.INACTIVE.COUNT.WARN}'
              name: 'More than {$AD.INACTIVE.COUNT.WARN} inactive AD users ({ITEM.LASTVALUE})'
              priority: WARNING
              description: 'The number of inactive (stale) AD users exceeds {$AD.INACTIVE.COUNT.WARN}.'
      discovery_rules:
        - uuid: 5b3b6a343d0f425b824ad0328846ca8d
          name: 'AD locked users'
          type: DEPENDENT
          key: LockedUsers
          delay: '0'
          item_prototypes:
            - uuid: 98af745d9bb840beb8c23d6dab50f2c8
              name: 'AD User: [{#USER}] Locked'
              type: DEPENDENT
              key: 'LockedOutUsers[{#USER}]'
              delay: '0'
              preprocessing:
                - type: JAVASCRIPT
                  parameters:
                    - |
                      var text = (value || "").trim();
                      if (!text) return 0;   // no data => not locked
                      
                      var arr;
                      try { arr = JSON.parse(text); } catch (e) { return 0; }
                      if (Object.prototype.toString.call(arr) !== "[object Array]") {
                        arr = arr ? [arr] : [];
                      }
                      for (var i = 0; i < arr.length; i++) {
                        if (arr[i].sAMAccountName === "{#USER}") return 1;
                      }
                      return 0;
              master_item:
                key: 'LockedOutUsers["{$AD.SEARCH.BASES}","{$AD.LDAP.SERVER}"]'
              tags:
                - tag: 'Customer Read'
              trigger_prototypes:
                - uuid: 58f26b377d2743c18b168170664ed935
                  expression: 'last(/AD DS User Monitoring Agent Active/LockedOutUsers[{#USER}])=1'
                  name: 'Account {#USER} is locked'
                  priority: AVERAGE
          master_item:
            key: 'LockedOutUsers["{$AD.SEARCH.BASES}","{$AD.LDAP.SERVER}"]'
          preprocessing:
            - type: JAVASCRIPT
              parameters:
                - |
                  // value can be "", "[]", "null" or JSON array
                  var text = (value || "").trim();
                  if (!text) {
                    return JSON.stringify({ "data": [] });
                  }
                  
                  var parsed;
                  try { parsed = JSON.parse(text); } catch (e) {
                    return JSON.stringify({ "data": [] });
                  }
                  
                  var isArray = Object.prototype.toString.call(parsed) === "[object Array]";
                  var arr = isArray ? parsed : (parsed ? [parsed] : []);
                  
                  var data = [];
                  for (var i = 0; i < arr.length; i++) {
                    var u = arr[i];
                    data.push({
                      "{#USER}": u.sAMAccountName,
                      "{#UPN}": u.UserPrincipalName,
                      "{#DN}": u.DistinguishedName,
                      "{#LOCKSINCE}": u.LockoutTimeUtc
                    });
                  }
                  return JSON.stringify({ "data": data });
        - uuid: ba83d57bff764535809a98200516075d
          name: 'AD users about to be disabled (account expiration)'
          type: DEPENDENT
          key: UsersAboutToDisable
          delay: '0'
          item_prototypes:
            - uuid: 5f536d3f56594fb391096a305798740b
              name: 'AD User: [{#USER}] About to be disabled'
              type: DEPENDENT
              key: 'UsersAboutToBeDisabled[{#USER}]'
              delay: '0'
              preprocessing:
                - type: JAVASCRIPT
                  parameters:
                    - |
                      var text = (value || "").trim();
                      if (!text) return 0;
                      
                      var arr;
                      try { arr = JSON.parse(text); } catch (e) { return 0; }
                      if (Object.prototype.toString.call(arr) !== "[object Array]") {
                        arr = arr ? [arr] : [];
                      }
                      for (var i = 0; i < arr.length; i++) {
                        if (arr[i].sAMAccountName === "{#USER}") return 1;
                      }
                      return 0;
              master_item:
                key: 'UsersAboutToBeDisabled[{$AD.ACCOUNT.EXPIRES.IN.DAYS},"{$AD.SEARCH.BASES}","{$AD.LDAP.SERVER}"]'
              tags:
                - tag: 'Customer Read'
              trigger_prototypes:
                - uuid: d79392ff5546403fa110afb059445213
                  expression: 'last(/AD DS User Monitoring Agent Active/UsersAboutToBeDisabled[{#USER}])=1'
                  name: 'Account {#USER} expires in {#DAYS_TO_DISABLE} days (expires {#ACCOUNT_EXPIRES})'
                  priority: WARNING
          master_item:
            key: 'UsersAboutToBeDisabled[{$AD.ACCOUNT.EXPIRES.IN.DAYS},"{$AD.SEARCH.BASES}","{$AD.LDAP.SERVER}"]'
          preprocessing:
            - type: JAVASCRIPT
              parameters:
                - |
                  var text = (value || "").trim();
                  if (!text) {
                    return JSON.stringify({ "data": [] });
                  }
                  
                  var parsed;
                  try { parsed = JSON.parse(text); } catch (e) {
                    return JSON.stringify({ "data": [] });
                  }
                  
                  var isArray = Object.prototype.toString.call(parsed) === "[object Array]";
                  var arr = isArray ? parsed : (parsed ? [parsed] : []);
                  
                  var data = [];
                  for (var i = 0; i < arr.length; i++) {
                    var u = arr[i];
                    data.push({
                      "{#USER}": u.sAMAccountName,
                      "{#UPN}": u.UserPrincipalName,
                      "{#DN}": u.DistinguishedName,
                      "{#ACCOUNT_EXPIRES}": u.AccountExpiresUtc,
                      "{#DAYS_TO_DISABLE}": u.DaysToDisable
                    });
                  }
                  
                  return JSON.stringify({ "data": data });
        - uuid: 7184ef07d8bd40758b68c61dee9a5161
          name: 'AD disabled users (older than N days)'
          type: DEPENDENT
          key: UsersDisabled
          delay: '0'
          item_prototypes:
            - uuid: c17ef8dfcfd44485859941be2294df10
              name: 'AD User: [{#USER}] Disabled'
              type: DEPENDENT
              key: 'ad.disabled.status[{#USER}]'
              delay: '0'
              preprocessing:
                - type: JAVASCRIPT
                  parameters:
                    - |
                      var text = (value || "").trim();
                      if (!text) return 0;
                      
                      var arr;
                      try { arr = JSON.parse(text); } catch (e) { return 0; }
                      if (Object.prototype.toString.call(arr) !== "[object Array]") {
                        arr = arr ? [arr] : [];
                      }
                      for (var i = 0; i < arr.length; i++) {
                        if (arr[i].sAMAccountName === "{#USER}") return 1; // in list => disabled
                      }
                      return 0;
              master_item:
                key: 'DisabledUsers[{$AD.DISABLED.OLDER.THAN.DAYS},"{$AD.SEARCH.BASES}","{$AD.LDAP.SERVER}"]'
              trigger_prototypes:
                - uuid: fa02091cba6b4b1d9c25222c32cac265
                  expression: 'last(/AD DS User Monitoring Agent Active/ad.disabled.status[{#USER}])=1'
                  name: 'Account {#USER} is disabled (since {#DISABLED_SINCE})'
                  priority: INFO
          master_item:
            key: 'DisabledUsers[{$AD.DISABLED.OLDER.THAN.DAYS},"{$AD.SEARCH.BASES}","{$AD.LDAP.SERVER}"]'
          preprocessing:
            - type: JAVASCRIPT
              parameters:
                - |
                  var text = (value || "").trim();
                  if (!text) {
                    return JSON.stringify({ "data": [] });
                  }
                  
                  var parsed;
                  try { parsed = JSON.parse(text); } catch (e) {
                    return JSON.stringify({ "data": [] });
                  }
                  
                  var isArray = Object.prototype.toString.call(parsed) === "[object Array]";
                  var arr = isArray ? parsed : (parsed ? [parsed] : []);
                  
                  var data = [];
                  for (var i = 0; i < arr.length; i++) {
                    var u = arr[i];
                    data.push({
                      "{#USER}": u.sAMAccountName,
                      "{#UPN}": u.UserPrincipalName,
                      "{#DN}": u.DistinguishedName,
                      "{#DISABLED_SINCE}": u.DisabledSinceUtc,
                      "{#DAYS_DISABLED}": u.DaysDisabled
                    });
                  }
                  return JSON.stringify({ "data": data });
        - uuid: e98d0f0b77874f37853f0a1ec57d3785
          name: 'AD users with passwords expiring soon'
          type: DEPENDENT
          key: UsersPasswordExpiring
          delay: '0'
          item_prototypes:
            - uuid: dfe6bab8a6cc4e99851baa5eae970543
              name: 'AD User: [{#USER}] Password expiring'
              type: DEPENDENT
              key: 'PasswordExpiringUsers[{#USER}]'
              delay: '0'
              preprocessing:
                - type: JAVASCRIPT
                  parameters:
                    - |
                      var text = (value || "").trim();
                      if (!text) return 0;
                      
                      var arr;
                      try { arr = JSON.parse(text); } catch (e) { return 0; }
                      if (Object.prototype.toString.call(arr) !== "[object Array]") {
                        arr = arr ? [arr] : [];
                      }
                      for (var i = 0; i < arr.length; i++) {
                        if (arr[i].sAMAccountName === "{#USER}") return 1;
                      }
                      return 0;
              master_item:
                key: 'PasswordExpiringUsers[{$AD.PASSWORD.EXPIRES.IN.DAYS},"{$AD.SEARCH.BASES}","{$AD.LDAP.SERVER}"]'
              tags:
                - tag: 'Customer Read'
              trigger_prototypes:
                - uuid: efa73771f3534a38b96d139d07b6ee7d
                  expression: 'last(/AD DS User Monitoring Agent Active/PasswordExpiringUsers[{#USER}])=1'
                  name: 'Password for {#USER} expires in {#DAYS_TO_EXPIRE} days (expires {#PWDEXPIRES})'
                  priority: WARNING
          master_item:
            key: 'PasswordExpiringUsers[{$AD.PASSWORD.EXPIRES.IN.DAYS},"{$AD.SEARCH.BASES}","{$AD.LDAP.SERVER}"]'
          preprocessing:
            - type: JAVASCRIPT
              parameters:
                - |
                  var text = (value || "").trim();
                  if (!text) {
                    return JSON.stringify({ "data": [] });
                  }
                  
                  var parsed;
                  try { parsed = JSON.parse(text); } catch (e) {
                    return JSON.stringify({ "data": [] });
                  }
                  
                  var isArray = Object.prototype.toString.call(parsed) === "[object Array]";
                  var arr = isArray ? parsed : (parsed ? [parsed] : []);
                  
                  var data = [];
                  for (var i = 0; i < arr.length; i++) {
                    var u = arr[i];
                    data.push({
                      "{#USER}": u.sAMAccountName,
                      "{#UPN}": u.UserPrincipalName,
                      "{#DN}": u.DistinguishedName,
                      "{#PWDEXPIRES}": u.PasswordExpiresUtc,
                      "{#DAYS_TO_EXPIRE}": u.DaysToExpire
                    });
                  }
                  
                  return JSON.stringify({ "data": data });
        - uuid: 382e5c79fa204709ae821d0b8375c226
          name: 'AD inactive users (last logon older than N days)'
          type: DEPENDENT
          key: UsersInactive
          delay: '0'
          item_prototypes:
            - uuid: d9c7d1f877324e4b9b075d1ae1d985c9
              name: 'AD User: [{#USER}] Days since last logon'
              type: DEPENDENT
              key: 'InactiveUsers.days[{#USER}]'
              delay: '0'
              value_type: UNSIGNED
              description: 'Days since replicated lastLogonTimestamp. For never-logged-on users, this is calculated from whenCreated.'
              preprocessing:
                - type: JAVASCRIPT
                  parameters:
                    - |
                      var text = (value || "").trim();
                      if (!text) return 0;

                      var arr;
                      try { arr = JSON.parse(text); } catch (e) { return 0; }
                      if (Object.prototype.toString.call(arr) !== "[object Array]") {
                        arr = arr ? [arr] : [];
                      }
                      for (var i = 0; i < arr.length; i++) {
                        if (arr[i].sAMAccountName === "{#USER}") {
                          var d = arr[i].DaysInactive;
                          if (d === null || d === undefined || d === "") return 0;
                          d = Number(d);
                          if (isNaN(d) || d < 0) return 0;
                          return Math.floor(d);
                        }
                      }
                      return 0;
              master_item:
                key: 'InactiveUsers[{$AD.INACTIVE.OLDER.THAN.DAYS},"{$AD.SEARCH.BASES}","{$AD.LDAP.SERVER}"]'
              tags:
                - tag: 'Customer Read'
              trigger_prototypes:
                - uuid: 509220a3f8654b9fb0b6a1d64a01e3d2
                  expression: 'last(/AD DS User Monitoring Agent Active/InactiveUsers.days[{#USER}])>={$AD.INACTIVE.OLDER.THAN.DAYS}'
                  name: 'Account {#USER} inactive for {ITEM.LASTVALUE} days (last logon {#LASTLOGON})'
                  priority: WARNING
                  description: 'The user last logon age is greater than or equal to {$AD.INACTIVE.OLDER.THAN.DAYS} days. The template default is 30 days.'
          master_item:
            key: 'InactiveUsers[{$AD.INACTIVE.OLDER.THAN.DAYS},"{$AD.SEARCH.BASES}","{$AD.LDAP.SERVER}"]'
          preprocessing:
            - type: JAVASCRIPT
              parameters:
                - |
                  var text = (value || "").trim();
                  if (!text) {
                    return JSON.stringify({ "data": [] });
                  }

                  var parsed;
                  try { parsed = JSON.parse(text); } catch (e) {
                    return JSON.stringify({ "data": [] });
                  }

                  var isArray = Object.prototype.toString.call(parsed) === "[object Array]";
                  var arr = isArray ? parsed : (parsed ? [parsed] : []);

                  var data = [];
                  for (var i = 0; i < arr.length; i++) {
                    var u = arr[i];
                    data.push({
                      "{#USER}": u.sAMAccountName,
                      "{#UPN}": u.UserPrincipalName,
                      "{#DN}": u.DistinguishedName,
                      "{#LASTLOGON}": u.LastLogonUtc ? u.LastLogonUtc : "never",
                      "{#DAYS_INACTIVE}": u.DaysInactive
                    });
                  }
                  return JSON.stringify({ "data": data });
      macros:
        - macro: '{$AD.ACCOUNT.EXPIRES.IN.DAYS}'
          value: '7'
          description: 'Account expiration threshold (days). Used by UsersAboutToBeDisabled[days,...].'
        - macro: '{$AD.DISABLED.OLDER.THAN.DAYS}'
          value: '30'
          description: 'Disabled user threshold (days). Used by DisabledUsers[days,...].'
        - macro: '{$AD.INACTIVE.COUNT.WARN}'
          value: '10'
          description: 'Aggregate threshold. Warn when the number of inactive (stale) AD users exceeds this count.'
        - macro: '{$AD.INACTIVE.OLDER.THAN.DAYS}'
          value: '30'
          description: 'Inactive (stale) user threshold (days). Per-user trigger fires when days since replicated lastLogonTimestamp is greater than or equal to this value. Used by InactiveUsers[days,...]. Default: 30.'
        - macro: '{$AD.LDAP.SERVER}'
          description: |
            Optional: specify the domain controller to query (hostname/FQDN).
            Leave empty to let Windows choose.
        - macro: '{$AD.NODATA.PERIOD}'
          value: '50h'
          description: 'Staleness window for the per-master-item nodata() triggers. Must exceed the largest master-item delay (24h) plus headroom so a single missed poll does not alert. Warns when a master item has received no data within this period (monitoring blind).'
        - macro: '{$AD.PASSWORD.EXPIRES.IN.DAYS}'
          value: '7'
          description: 'Password expiry threshold (days). Used by PasswordExpiringUsers[days,...].'
        - macro: '{$AD.SEARCH.BASES}'
          description: |
            Base DN(s) to search (OU/container). Leave empty to search the whole domain.
            Multiple base DNs can be separated with ';' or '|'.
            Example: OU=Users,DC=example,DC=com;OU=Admins,DC=example,DC=com
