Plugins.ADUserMonitoring.System.Path=C:\Program Files\Zabbix Agent 2\zabbix-agent2-ad-user-monitoring.exe

# AD LDAP queries are relatively heavy. Keep this plugin serialized so active
# master items do not scan the same domain concurrently after restart or schedule
# alignment.
Plugins.ADUserMonitoring.System.Capacity=1

# Default is 0 in current Zabbix Agent 2, but keep it explicit for this plugin.
Plugins.ADUserMonitoring.System.ForceActiveChecksOnStart=0
