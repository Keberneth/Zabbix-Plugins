name: Build Plugins

on:
  push:
    branches: [main]
    paths:
      - "Windows/**/*.go"
      - "Windows/**/go.mod"
      - "Windows/**/go.sum"
      - "Windows/versioninfo.base.json"
      - "Linux/**/*.go"
      - "Linux/**/go.mod"
      - "Linux/**/go.sum"
      - ".github/workflows/build-plugins.yml"
  pull_request:
    paths:
      - "Windows/**/*.go"
      - "Windows/**/go.mod"
      - "Windows/**/go.sum"
      - "Windows/versioninfo.base.json"
      - "Linux/**/*.go"
      - "Linux/**/go.mod"
      - "Linux/**/go.sum"
      - ".github/workflows/build-plugins.yml"
  workflow_dispatch:

# Least privilege by default; only the release job is granted contents: write.
permissions:
  contents: read

# Serialize runs on the same ref so two overlapping pushes to main cannot race
# each other's make_latest release (the second-to-finish would otherwise
# overwrite "latest" with a partial set). Superseded pull-request runs are
# cancelled since they never publish; main runs are always allowed to finish.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  detect-changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      matrix: ${{ steps.filter.outputs.matrix }}
      has_changes: ${{ steps.filter.outputs.has_changes }}
      expected_count: ${{ steps.filter.outputs.expected_count }}
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          persist-credentials: false

      - name: Collect plugin matrix
        id: filter
        run: |
          # Build EVERY plugin on every run. The release job publishes a single
          # make_latest release containing only this run's artifacts, so building
          # a subset (only the plugins changed since the previous commit) left the
          # "latest" release missing every other plugin's binary. A Zabbix Agent 2
          # loadable plugin whose System.Path .exe is absent makes the agent fail
          # to start entirely, so each release must carry the full set.
          PLUGINS='[]'

          add_plugin() {
            local dir="$1" goos="$2" binary="$3"
            PLUGINS=$(echo "$PLUGINS" | jq -c \
              --arg d "$dir" --arg g "$goos" --arg b "$binary" \
              '. += [{"dir":$d,"goos":$g,"binary":$b}]')
          }

          # Windows plugins
          add_plugin "Windows/windows_ad_user_monitoring"     "windows" "zabbix-agent2-ad-user-monitoring.exe"
          add_plugin "Windows/windows_application_inventory"  "windows" "zabbix-agent2-application-inventory.exe"
          add_plugin "Windows/windows_failover_cluster"       "windows" "zabbix-agent2-windows-failover-cluster.exe"
          add_plugin "Windows/windows_needs_reboot_check"     "windows" "zabbix-agent2-needs-reboot-check.exe"
          add_plugin "Windows/windows_network_connections"    "windows" "zabbix-agent2-windows-network-connections.exe"
          add_plugin "Windows/windows_ntp_sync"               "windows" "zabbix-agent2-windows-ntpsync.exe"
          add_plugin "Windows/windows_recurring_event_Error"  "windows" "zabbix-agent2-windows-recurring-event.exe"
          add_plugin "Windows/windows_service_listening_port" "windows" "zabbix-agent2-windows-service-listening-port.exe"
          add_plugin "Windows/WindowsLatestUpdate"            "windows" "zabbix-agent2-windows-latest-update.exe"

          # Linux plugins
          add_plugin "Linux/linux_btg_account_check"          "linux"   "zabbix-agent2-linux-btg-account-check"
          add_plugin "Linux/linux_needs_reboot_check"         "linux"   "zabbix-agent2-needs-reboot-check"
          add_plugin "Linux/linux_network_connections"        "linux"   "zabbix-agent2-linux-network-connections"
          add_plugin "Linux/linux_ntp_sync"                   "linux"   "zabbix-agent2-linux-ntp-sync"
          add_plugin "Linux/linux_service_listening_port"     "linux"   "zabbix-agent2-linux-service-listening-port"

          COUNT=$(echo "$PLUGINS" | jq 'length')
          if [ "$PLUGINS" = "[]" ]; then
            echo "has_changes=false" >> "$GITHUB_OUTPUT"
            echo 'matrix={"include":[]}' >> "$GITHUB_OUTPUT"
            echo "expected_count=0" >> "$GITHUB_OUTPUT"
          else
            echo "has_changes=true" >> "$GITHUB_OUTPUT"
            echo "matrix=$(echo "$PLUGINS" | jq -c '{"include":.}')" >> "$GITHUB_OUTPUT"
            echo "expected_count=$COUNT" >> "$GITHUB_OUTPUT"
          fi

  build:
    needs: detect-changes
    if: needs.detect-changes.outputs.has_changes == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.detect-changes.outputs.matrix) }}
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version-file: ${{ matrix.dir }}/go.mod
          cache: true
          cache-dependency-path: ${{ matrix.dir }}/go.sum

      - name: Verify dependencies
        working-directory: ${{ matrix.dir }}
        run: |
          go mod download
          go mod verify

      - name: Vet (${{ matrix.goos }})
        # Static analysis on every push AND pull request. Previously code was only
        # ever built after it had already landed on main, so a broken change was
        # detected too late; running vet here gives PRs fast feedback.
        #
        # unsafeptr is disabled: these plugins convert uintptr values returned by
        # Win32/syscall APIs back to unsafe.Pointer (the referenced memory is owned
        # by the OS/DLL, not the Go GC), which the analyzer flags as a false
        # positive. All other vet analyzers remain enabled.
        working-directory: ${{ matrix.dir }}
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: amd64
          CGO_ENABLED: "0"
        run: go vet -unsafeptr=false ./...

      - name: Install govulncheck
        # Pinned (not @latest) so a CI run is reproducible and cannot be changed
        # under us by a new upstream release.
        run: go install golang.org/x/vuln/cmd/govulncheck@v1.5.0

      - name: Vulnerability scan (govulncheck)
        working-directory: ${{ matrix.dir }}
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: amd64
        run: govulncheck ./...

      - name: Embed Windows version metadata
        # Stamp the PE with CompanyName/ProductName/FileDescription/version so it
        # is not a metadata-less binary — a small but real factor in Defender's
        # ML reputation scoring. Best-effort: never block a release on it.
        if: matrix.goos == 'windows'
        continue-on-error: true
        working-directory: ${{ matrix.dir }}
        run: |
          go install github.com/josephspurrier/goversioninfo/cmd/goversioninfo@v1.4.1
          bin='${{ matrix.binary }}'
          name="${bin%.exe}"
          "$(go env GOPATH)/bin/goversioninfo" -64 \
            -product-name "Zabbix Agent 2 Monitoring Plugins" \
            -description "Read-only Zabbix Agent 2 monitoring plugin ($name)" \
            -original-name "$bin" \
            -internal-name "$name" \
            -o resource_windows_amd64.syso \
            "$GITHUB_WORKSPACE/Windows/versioninfo.base.json"
          echo "Embedded version metadata into resource_windows_amd64.syso"

      - name: Build ${{ matrix.binary }}
        working-directory: ${{ matrix.dir }}
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: amd64
          CGO_ENABLED: "0"
        run: |
          go build -trimpath -ldflags "-s -w" -o "${{ matrix.binary }}"
          echo "Built ${{ matrix.binary }} ($(wc -c < "${{ matrix.binary }}") bytes)"

      - name: Code-sign ${{ matrix.binary }} (optional)
        # Authenticode-sign Windows binaries when a signing cert is configured.
        # Skipped (exit 0) inside the script when WINDOWS_CODE_SIGN_PFX_BASE64 is
        # unset — e.g. on fork pull requests, which have no access to secrets.
        #
        # The signing secrets are scoped to THIS step's env only (not the job env),
        # so earlier steps — go build, module downloads, govulncheck's own install —
        # never have the code-signing key/password in their environment where a
        # compromised dependency could read and exfiltrate them.
        if: matrix.goos == 'windows' && github.event_name != 'pull_request'
        working-directory: ${{ matrix.dir }}
        env:
          SIGN_PFX_BASE64: ${{ secrets.WINDOWS_CODE_SIGN_PFX_BASE64 }}
          SIGN_PFX_PASSWORD: ${{ secrets.WINDOWS_CODE_SIGN_PFX_PASSWORD }}
        run: |
          if [ -z "$SIGN_PFX_BASE64" ]; then
            echo "No code-signing certificate configured; skipping signing."
            exit 0
          fi
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends osslsigncode
          printf '%s' "$SIGN_PFX_BASE64" | base64 -d > "$RUNNER_TEMP/codesign.pfx"
          osslsigncode sign \
            -pkcs12 "$RUNNER_TEMP/codesign.pfx" -pass "$SIGN_PFX_PASSWORD" \
            -h sha256 \
            -n "Zabbix Agent 2 monitoring plugin" \
            -i "https://github.com/Keberneth/Zabbix-Plugins" \
            -ts http://timestamp.digicert.com \
            -in "${{ matrix.binary }}" -out "${{ matrix.binary }}.signed"
          mv "${{ matrix.binary }}.signed" "${{ matrix.binary }}"
          rm -f "$RUNNER_TEMP/codesign.pfx"
          echo "Signed ${{ matrix.binary }}"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ matrix.binary }}
          path: ${{ matrix.dir }}/${{ matrix.binary }}
          retention-days: 90

  scan:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: artifacts

      - name: Install ClamAV
        # Installed and freshclam-updated ONCE here instead of in every one of the
        # 14 matrix build jobs, which each downloaded the full signature DB (~200 MB)
        # — a large, repeated waste of CI time and bandwidth.
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends clamav
          sudo systemctl stop clamav-freshclam.service 2>/dev/null || true
          sudo freshclam --quiet

      - name: AV scan all binaries
        run: |
          # Scan every downloaded artifact. A detection fails this job and, because
          # release needs [build, scan], blocks publishing.
          clamscan --infected --recursive=yes --no-summary artifacts

  release:
    needs: [detect-changes, build, scan]
    # Never publish from a pull request; only from pushes to main / manual dispatch.
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: artifacts

      - name: Collect binaries
        run: |
          mkdir -p release
          find artifacts -type f | while read -r f; do
            cp "$f" release/
          done
          echo "Release contents:"
          ls -lh release/

      - name: Verify the release contains every built binary
        env:
          EXPECTED: ${{ needs.detect-changes.outputs.expected_count }}
        run: |
          # Refuse to publish an incomplete make_latest release: a missing
          # binary would leave users' Plugins.<name>.System.Path pointing at a
          # nonexistent .exe, which makes Zabbix Agent 2 fail to start entirely.
          ACTUAL=$(find release -type f | wc -l)
          echo "Expected $EXPECTED binaries, found $ACTUAL."
          if [ "$ACTUAL" -ne "$EXPECTED" ]; then
            echo "::error::Release is incomplete ($ACTUAL/$EXPECTED binaries); not publishing."
            exit 1
          fi

      - name: Generate SHA256 manifest
        # Ship a hash manifest so operators can verify each binary on the host
        # (and report exact hashes to Microsoft when submitting false positives).
        working-directory: release
        run: |
          sha256sum -- * > SHA256SUMS.txt
          echo "SHA256SUMS.txt:"
          cat SHA256SUMS.txt

      - uses: softprops/action-gh-release@b4309332981a82ec1c5618f44dd2e27cc8bfbfda # v3.0.0
        with:
          tag_name: build-${{ github.run_number }}
          name: Build #${{ github.run_number }}
          body: |
            Automated build from [`${{ github.sha }}`](${{ github.server_url }}/${{ github.repository }}/commit/${{ github.sha }})

            Triggered by: ${{ github.event_name }}
          files: release/*
          make_latest: true
