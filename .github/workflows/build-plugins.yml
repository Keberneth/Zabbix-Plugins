name: Build Plugins

on:
  push:
    branches: [main]
    paths:
      - "Windows/**/*.go"
      - "Windows/**/go.mod"
      - "Windows/**/go.sum"
      - "Linux/**/*.go"
      - "Linux/**/go.mod"
      - "Linux/**/go.sum"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  detect-changes:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.filter.outputs.matrix }}
      has_changes: ${{ steps.filter.outputs.has_changes }}
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          fetch-depth: 2
          persist-credentials: false

      - name: Detect changed plugins
        id: filter
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            MATCH_ALL=true
          elif git rev-parse HEAD~1 >/dev/null 2>&1; then
            MATCH_ALL=false
            CHANGED=$(git diff --name-only HEAD~1 HEAD)
          else
            MATCH_ALL=true
          fi

          PLUGINS='[]'

          add_plugin() {
            local dir="$1" goos="$2" binary="$3"
            if [ "$MATCH_ALL" = true ] || echo "$CHANGED" | grep -q "^${dir}/"; then
              PLUGINS=$(echo "$PLUGINS" | jq -c \
                --arg d "$dir" --arg g "$goos" --arg b "$binary" \
                '. += [{"dir":$d,"goos":$g,"binary":$b}]')
            fi
          }

          # Windows plugins
          add_plugin "Windows/windows_ad_user_monitoring"     "windows" "zabbix-agent2-ad-user-monitoring.exe"
          add_plugin "Windows/windows_application_inventory"  "windows" "zabbix-agent2-application-inventory.exe"
          add_plugin "Windows/windows_failover_cluster"       "windows" "zabbix-agent2-windows-failover-cluster.exe"
          add_plugin "Windows/windows_needs_reboot_check"     "windows" "zabbix-agent2-needs-reboot-check.exe"
          add_plugin "Windows/windows_network_connections"    "windows" "zabbix-agent2-windows-network-connections.exe"
          add_plugin "Windows/windows_ntp_sync"               "windows" "zabbix-agent2-windows-ntpsync.exe"
          add_plugin "Windows/windows_recurring_event_Error"  "windows" "zabbix-agent2-windows-recurring-event.exe"
          add_plugin "Windows/windows_service_listening_port" "windows" "zabbix-agent2-windows-service-listening-port.exe"
          add_plugin "Windows/WindowsLatestUpdate"            "windows" "zabbix-agent2-windows-latest-update.exe"

          # Linux plugins
          add_plugin "Linux/linux_btg_account_check"          "linux"   "zabbix-agent2-linux-btg-account-check"
          add_plugin "Linux/linux_needs_reboot_check"         "linux"   "zabbix-agent2-needs-reboot-check"
          add_plugin "Linux/linux_network_connections"        "linux"   "zabbix-agent2-linux-network-connections"
          add_plugin "Linux/linux_ntp_sync"                   "linux"   "zabbix-agent2-linux-ntp-sync"
          add_plugin "Linux/linux_service_listening_port"     "linux"   "zabbix-agent2-linux-service-listening-port"

          if [ "$PLUGINS" = "[]" ]; then
            echo "has_changes=false" >> "$GITHUB_OUTPUT"
            echo 'matrix={"include":[]}' >> "$GITHUB_OUTPUT"
          else
            echo "has_changes=true" >> "$GITHUB_OUTPUT"
            echo "matrix=$(echo "$PLUGINS" | jq -c '{"include":.}')" >> "$GITHUB_OUTPUT"
          fi

  build:
    needs: detect-changes
    if: needs.detect-changes.outputs.has_changes == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.detect-changes.outputs.matrix) }}
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version-file: ${{ matrix.dir }}/go.mod
          cache: true
          cache-dependency-path: ${{ matrix.dir }}/go.sum

      - name: Verify dependencies
        working-directory: ${{ matrix.dir }}
        run: |
          go mod download
          go mod verify

      - name: Install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@latest

      - name: Vulnerability scan (govulncheck)
        working-directory: ${{ matrix.dir }}
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: amd64
        run: govulncheck ./...

      - name: Build ${{ matrix.binary }}
        working-directory: ${{ matrix.dir }}
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: amd64
          CGO_ENABLED: "0"
        run: |
          go build -trimpath -ldflags "-s -w" -o "${{ matrix.binary }}"
          echo "Built ${{ matrix.binary }} ($(wc -c < "${{ matrix.binary }}") bytes)"

      - name: Install ClamAV
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends clamav
          sudo systemctl stop clamav-freshclam.service 2>/dev/null || true
          sudo freshclam --quiet

      - name: AV scan ${{ matrix.binary }}
        working-directory: ${{ matrix.dir }}
        run: clamscan --infected --recursive=no --no-summary "${{ matrix.binary }}"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ matrix.binary }}
          path: ${{ matrix.dir }}/${{ matrix.binary }}
          retention-days: 90

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: artifacts

      - name: Collect binaries
        run: |
          mkdir -p release
          find artifacts -type f | while read -r f; do
            cp "$f" release/
          done
          echo "Release contents:"
          ls -lh release/

      - uses: softprops/action-gh-release@b4309332981a82ec1c5618f44dd2e27cc8bfbfda # v3.0.0
        with:
          tag_name: build-${{ github.run_number }}
          name: Build #${{ github.run_number }}
          body: |
            Automated build from [`${{ github.sha }}`](${{ github.server_url }}/${{ github.repository }}/commit/${{ github.sha }})

            Triggered by: ${{ github.event_name }}
          files: release/*
          make_latest: true
